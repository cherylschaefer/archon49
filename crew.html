blished by Inkstained Succubus Press. The trilogy was completed with Heart of the Beast, published as a compendium by Pro Se Press. Other publications include stories published in anthologies Cover of Darkness, When the Shadow Sees the Sun, and Coppice and Brake Vol. 2. His most recent release is A Night at Death’s Door, published in 2023 by Pro Se Publications. Jim also runs the YouTube channel Bo’s Backyard BBQ showing his love for his Southern roots of low and slow cooking. Jim earned a bachelor’s degree in English literature and philosophy from Southern Illinois University Edwardsville. He is a member of the Literary Underworld and the Eville Writers, and is the biggest Godzilla fan in the western hemisphere. He is married to author Elizabeth Donald, and their family lives in a haunted house in Illinois."}, "437": {"n": "Jack Glassman", "s": "Laser physicist and professor emeritus at SIUE; science and society.", "b": "As a professional scientist and science educator, I am passionate about the intersection of science and society. Science Fiction’s focus on that intersection has always drawn me to it and my love of Science Fiction has always provided much of the impetus for my own career. I am an Associate Professor Emeritus from the Department of Physics at Southern Illinois University Edwardsville, where I have taught since 2004. Prior to coming to SIUE, I was Director of Laser Development at the Nevada Terawatt Facility in Reno, NV. I have also worked at Lawrence Livermore National Laboratory and the Air Force Research Laboratory (as well as several other places). I hold a Ph.D. in Optical Sciences (specializing in laser physics and quantum optics) and an MS in Physics from the University of New Mexico, and a BS in Physics from the University of Arizona. My wife and I live in an earth-shelter house (think \"hobbit hole\") in rural Illinois with (at the moment) two cats, one dog, and whatever has crept in when we weren't looking."}, "4405": {"n": "Ray Tabler", "s": "Humorous, upbeat SF and fantasy author; retired engineer.", "b": "Ray is an author of humorous, upbeat science fiction & fantasy. A retired engineer, Ray’s originally from  Louisville, KY. Although he’s lived the past few decades in the frozen north (Michigan) due to a tragic addiction to a steady paycheck."}, "442": {"n": "Paul Hahn", "s": "Lifelong SF reader and language buff; Tolkien language coach for the St. Louis Symphony.", "b": "Paul Hahn learned to read from his brother’s Tom Swift Jr. books.  By middle school he had read through all the SF in his local branch public library, in alphabetical order.  He enjoys exposing people to unconventional ideas like recumbent bicycles and shoes with toes, sometimes simultaneously.  When the Saint Louis Symphony Orchestra and Chorus performed Howard Shore's music from the Lord of the Rings movies, he acted as language coach."}, "4599": {"n": "Zi Teng Wang", "s": "Stage magician and biologist who uses magic to teach how perception gets fooled.", "b": "Zi is a Magician and Scientist based in the St Louis region, who has been performing magic on stages and at events throughout the country for more than 10 years, with a passion for inspiring wonder, critical thinking, and appreciation of our knowledge of the world around us. In addition to his work as a Magician, Zi is also an accomplished Scientist with a focus in Biology. Zi uses Magic to teach about the neuroscience of perception, illustrating the ways that our senses can be tricked, and shedding light on the shortcuts and blind spots that we all share."}, "4637": {"n": "Gary Hanak", "s": "", "b": ""}, "4661": {"n": "LaShaunda C. Hoffman", "s": "Runs Shades of Romance magazine (multicultural fiction); Writer's Cafe podcast host.", "b": "LaShaunda C. Hoffman is the author of Building Online Relationships – One Reader at a Time. She created the award-winning online magazine for readers and writers of multicultural literature, Shades of Romance (SORMAG Digital), and hosts Writer’s Cafe Podcast."}, "47": {"n": "R.J. Carter", "s": "Author, publisher and songwriter; story collection Strange Imaginings.", "b": "Author / Publisher / Songwriter. Stick around, who knows what I'll be next year! Latest work: \"Strange Imaginings\" short story collection published through Critical Blast Publishing."}, "4704": {"n": "Dan Yezbick", "s": "English and media professor; SF, comics history and film scholar.", "b": "Daniel Yezbick has worked as a screenwriter, sheep wrangler, film festival judge, and intergalactic bartender. He is currently Professor of English and Communications at Wildwood College outside of St. Louis, MO, where he teaches media, literature, and writing courses. He also serves as Adjunct Professor for Webster University’s School of Communications and American Public University/American Military University’s professional and technical writing program. He has lectured and published on diverse topics including interdisciplinary Science Fiction, Comics History, Animal and Anthropocene Studies, Hollywood Cinema, Radio Drama, and Globalized Shakespeare. His retrospective celebration of the American children’s artist, George Carlson, Perfect Nonsense, was released in 2014 from Fantagraphics Books and his recent essays on media and culture have appeared in a variety of journals and anthologies including The Blacker the Ink, The Other 1980s, Monstrous Women in Comics, Disney Channel Tween Programming, and The Oxford Handbook of Comics Studies. He lives happily in South City St Louis with Sarah Burk “The Clarinet Doctor,” his quirky teenage offspring, and two idiot rescue mutts."}, "4881": {"n": "Jeremy Shipley", "s": "Illustrator of eerie horror, cyberpunk and surreal art for comics, zines and RPGs; inspired by 1950s horror comics.", "b": "I am an artist and author, located on the Illinois side of the St. Louis metropolitan region. I earned my MFA in Visual Art from Washington University in St. Louis where my interdisciplinary research and creative practice expanded into comparative literature, media studies, and computer graphics. I have accumulated over five years of teaching professional level courses in drawing, design, digital media, animation, and art history while also leading workshops, moderating panel discussions, and giving lecture demonstrations on advanced techniques of digital painting, character illustration, environment design, storyboarding, and creative writing. My scholarship continues to investigate the visual language, transmedia history, and intersecting philosophies of uncanny art and literature. The work I do specializes in illustration for comics, zines, and role playing games some of which has been published in comics anthologies, juried into gallery exhibitions, and collected by private and public libraries across the country. In my free time, when I am not sharing my passion for surrealism and visual communication with others, I especially enjoy reading science fiction, collecting physical media, and creating characters for role playing games. Documents Jeremy Shipley's Constellation of Principles for Drawing Characters.png (901.16KB)"}, "507": {"n": "Rachael Mayo", "s": "Fantasy/SF artist of detailed creatures in mixed traditional media; coloring books.", "b": "Rachael Mayo is a fantasy and SF artist from the Kansas City, Missouri area. She earned a BFA in Illustration from University of Central Missouri in 1999. She considers art her foremost hobby and spends most weekends drawing and coloring fantastically detailed creatures.  Rachael prefers traditional art mediums and specializes in combination techniques that include watercolor, colored pencil, paint pens, ink, acrylic, and 3D objects. She also designs drawings to color, and has five coloring books published to date."}, "5215": {"n": "Gracie York", "s": "Editor who founded the York Editing Guild for self-published authors; children's novelist.", "b": "Gracie York is the guild founder and head editor of the York Editing Guild, offering editorial services to self-published authors. She's also edited everything from medical textbooks to sci-fi/fantasy books for traditional publishers. Gracie accidentally writes things in her spare time. It’s definitely not an attempt to disprove the old maxim, “Those who can’t write, edit.” Her children's novel, Hannah Hattington Goes on an Adventure, is available on Amazon. In her past lives, Gracie taught English in Korea, nannied, answered phones for a credit union, and directed operations for a local nonprofit. At the moment, she’s likely gardening or trying to get her husband to play another game of Citadels."}, "5216": {"n": "Codi Coleman", "s": "Fanfic writer, fan artist and cosplayer; first-time panelist.", "b": "28, fanfic author, fan artist, and cosplayer. Long-time con attendee, first time speaker! Very excited for Archon this fall."}, "5333": {"n": "Allison Altayar", "s": "", "b": ""}, "5347": {"n": "Kathy L. Brown", "s": "Historical speculative fiction; Sean Joye supernatural noir series set around St. Louis.", "b": "Kathy L. Brown writes award-winning speculative fiction with a historical twist. Her flagship book series is The Sean Joye Investigations, atmospheric supernatural noir stories set in the St. Louis area."}, "5356": {"n": "Max Hoven", "s": "Comics, graphic novels and film producer (Hoven Crow Entertainment); podcaster.", "b": "Max Hoven is a best-selling author, podcaster, film producer, and founder of Hoven Crow Entertainment LLC, an American media company dedicated to producing high-quality comic books, graphic novels, and feature films while providing educational products and services for other comic creators and filmmakers."}, "537": {"n": "Christine Nobbe", "s": "NASA JPL Solar System Ambassador and gifted-education director, \"Space Girl\" of St. Louis.", "b": "Christine Nobbe is a dedicated educator with a passion for space exploration and gifted education. She serves as the Director of Gifted Education for the Missouri Department of Elementary and Secondary Education and is a Solar System Ambassador for NASA JPL. Christine's work focuses on inspiring the next generation of space explorers and settlers through STEAM education. Christine's efforts in outreach and public engagement have earned her the nickname \"Space Girl\" in St. Louis."}, "547": {"n": "Bob Perry", "s": "Retired physicist and amateur astronomer; space advocate focused on lunar and asteroid resources.", "b": "Bob, retired for more than twenty years, began reading science fiction before the Soviets stunned the USA by launching Sputnik.  He is a long time space advocate and amateur astronomer, holding BS and MS degrees in Physics with a minor in Computer Science.  He has been an active member of the St. Louis Chapter of the Moon Society and the St. Louis Space Frontier, a Chapter of the National Space Society.  His interest in space includes the utilization of lunar resources, including mining the cometary volatiles trapped in the lunar cryogenic polar craters, and the utilization of asteroids and comets as raw materials for a space faring civilization."}, "552": {"n": "Pierre Pettinger Jr", "s": "Award-winning masquerade costumer (four Worldcon Best in Show) and indie SF author.", "b": "Pierre Pettinger is an award-winning costumer with 43 years of experience. With his wife, Sandy, he has won numerous masquerade awards, including four Worldcon Best-In-Shows. He has judged many masquerades across the country. He is a past president of the international Costumers' Guild and currently serves as the Parliamentarian and Archivist of the ICG. Pierre is also an independent author with five SF books in his Sodality Universe series and the first fantasy book in his Shattered World series available."}, "567": {"n": "Marella Sands", "s": "St. Louis historical fantasy author, playwright and paranormal-site traveler.", "b": "Marella is a native St. Louisan who has published fiction, non-fiction, poetry, and is a playwright. Her historical fantasy novels, Sky Knife and Serpent and Storm, were set in 5th century Central America. She wrote a series on an alternate United States available from Histria Publishing. Currently, she is working on a non-fiction series on the paranormal, a dark horror series on a bartender swept up into the conflict of immortal supernatural beings, and is working on the fourth edition of her Twi-English dictionary. Like many authors, she always has more projects in the fire than she will ever finish. Marella likes to travel and has visited the Sasquatch Outpost in Bailey, Colorado; the Mothman Museum in Point Pleasant, West Virginia; the Pope Lick Trestle in Louisville, Kentucky; Loveland, Ohio; the Alien Highway in Nevada; and Lily Dale, New York. She also spent the night in the former Missouri State Penitentiary in Jefferson City looking for anything strange. So far she has not experienced the paranormal, but if you have, and want to share, find her, and tell her all about it."}, "57": {"n": "Glen Cook", "s": "Fantasy author of The Black Company and the Garrett, P.I. series.", "b": ""}, "5745": {"n": "Tim Griffin", "s": "Filk (fan music) Guest of Honor.", "b": ""}, "5760": {"n": "Matt Roggentine", "s": "Air Force vet who flew GPS satellites, now surgical radiology tech and new SF/F author.", "b": "I have lived several lifetimes. I’m a veteran of the US Air Force and flew GPS satellites for 7 years. Later, I transitioned into the IT world. I worked as a contractor for the US Coast Guard for several years before deciding, in my forties, that I needed a change. I went back to school and got a degree in Radiologic Technology, and currently work full time at a hospital, primarily running a c-arm in surgery. I also love reading Sci-Fi and Fantasy novels. Writing books has been a lifelong goal of mine. Now that I’ve started, I don’t plan to stop."}, "5861": {"n": "John Wardale", "s": "", "b": ""}, "5904": {"n": "Mike Wotka", "s": "", "b": ""}, "5905": {"n": "Thomas Eyssell", "s": "", "b": ""}, "597": {"n": "Allison Stein", "s": "Watercolor and mixed-media artist and author; SFWA member, retired tech writer.", "b": "Allison Stein is an artist, author, TV addict, geek princess, and cat servant — not necessarily in that order. She works with watercolor, mixed media, and photography, which means she likes watching paint dry, tearing colorful paper, and gluing stuff to other stuff. A member of Kansas City Science Fiction & Fantasy Society, SFWA, and NobleFusion, she recently retired from writing software documentation that even technophobes can understand. She serves as parliamentarian for the National Federation of Press Women, which advocates for media literacy and support of First Amendment rights. When not making art, Allison travels, hoards art supplies, and practices Advanced Google-Fu. Facebook.com/allison.stein, https://www.allisonstein.com/, https://www.instagram.com/allisonstein1/, @allisonstein.bsky.social"}, "6014": {"n": "Joseph Weihrauch", "s": "", "b": ""}, "6112": {"n": "Janine Wardale", "s": "Costumer and fiber artist: intricate mixed-media costumes (sewing, crochet, beadwork, dyeing). On a Worldcon Best in Show team.", "b": ""}, "6139": {"n": "Chuck Bond", "s": "", "b": ""}, "617": {"n": "Mark Tiedemann", "s": "SF author shortlisted for the Philip K. Dick Award; Asimov's Robot and Terminator tie-in novels.", "b": "Mark W. Tiedemann is the author the Secantis Sequence, Remains, and Granger's Crossing, as well as eighty short stories. Compass Reach, volume one of the Secantis Sequence, was short-listed for the Philip K. Dick Award and is to be reissued from Histria Books. Remains, a stand-alone science fiction mystery, was shortlisted for the James Tiptree Jr Award (now known as the Otherwise Award). Granger's Crossing is a historical mystery, the first volume (hopefully) in a series set in Colonial St. Louis. He has also published novels in the Asimov's Robot universe and the Terminator universe. His short fiction has appeared in Asimov's SF, Analog, the Magazine of Fantasy and Science Fiction, Science Fiction Age, and several anthologies. Between 2002 and 2011 he served on the board of the Missouri Center for the Book, the state affiliate of the Library of Congress Center for the Book, five years as president. As well, he is an avid photographer and amateur musician. He lives in St. Louis, Missouri."}, "6281": {"n": "Jeremiah D. MacRoberts", "s": "Army chaplain turned author; philosophy, mythology and trauma inform the fiction.", "b": "Doctor Jeremiah D. MacRoberts is an academically educated philosopher (BA, University of Kentucky, 2005), clergyman (MDiv, Lexington Theological Seminary, 2008), and counselor (DMin, Liberty University, 2022). He enlisted in the US Army following high school as a Private (1998), serving in special operations units before commissioning as a Chaplain, a decade later, and attaining the rank of Captain (2012). Chaplain MacRoberts left the military to work for the Department of Veterans Affairs but has also served as a rural church pastor, guest preacher, chaplain for civilian hospice, and provider of free counseling. An avid reader, occasional gamer, amateur historian, comparative mythologies scholar, and independent capital strategist, Dr. Mac also uses this wide variety of life experiences to inform the characters of his fiction. Encounters with group dynamics, traumatic stress, poverty, recovery, morality, wisdom, destiny, faith, fear, forgiveness, cognitive dissonance, emotional grief, and physical pain all inform the complexity of his stories. Jeremiah D. MacRoberts continues publishing new entries into his \"Starscape Chronicles\" sci-fi space opera (12 books and counting) as well as his \"Swords of Faith\" traditional fantasy series (6 books and counting). Titles including \"The Beast of Spearpointe,\" \"The Power Within,\" \"Before Commonwealth,\" \"Birth of the Legion,\" and a dozen more build a shared narrative universe between both series that continues to expand annually."}, "6283": {"n": "Richard H Moon", "s": "Genre writer and film producer with a physics degree; debut novel To Conquer Death.", "b": "Richard H Moon is an award-winning genre writer & film producer from Southern California. He holds a Bachelor’s of Science degree in Physics from UC Riverside, and the problem-solving and research skills he learned there are what drives his writing and his devotion to strong story and character. He has produced feature films starring Ryan Eggold, Stephen Bauer, and Peter Van Norden, pilots staring Daniel Bernhardt, Mackenzie Astin, and Michael Dorn, and a documentary about homeless families in Los Angeles. His first novel “To Conquer Death” came out in 2025. He has won awards and accolades from the Austin Film Festival, AAA Screenwriting Awards, PAGE Screenwriting Awards, Eerie HorrorFest, Nicholls and Inroads Fellowships, and was a finalist for the Speculative Literature Foundation’s Diversity Grant in 2022. His writing pushes genre conventions, always searching for the logical conundrum that collapses under the weight of human emotion, and teasing out unexamined details of well-worn narratives. Whether it is a real-world retelling of a fairy-tale classic, a collision of scifi revolution with classic western tropes, or epic fantasy examinations of historical mysteries, his work always seeks to make a viewer think in new ways about familiar topics. In addition to writing full-time, he is a development producer with Voyage Media, and works with City of Hope Research Hospital and CSU Long Beach’s IACUC and IRB. He has fostered kittens for the Pasadena Humane Society, and is currently looking forward to rebuilding the home his family lost in the Eaton Fire."}, "6285": {"n": "Jamie Madigan", "s": "Psychologist who writes about the psychology of video games and D&D.", "b": "Jamie Madigan, Ph.D. is a psychologist, gamer, and nonfiction author who seeks to popularize the use of psychology to creating better video games and helping understand those who play them. I write and podcast at www.psychologyofgames.com . My book Getting Gamers: The Psychology of Video Games and Their Impact on Those Who Play Them and my other book The Psychology of Dungeons & Dragons are available wherever you buy books, or find out more here ."}, "6297": {"n": "Kevin Randle", "s": "UFO researcher and author of many Roswell books; appeared in Unsolved Mysteries.", "b": "Kevin D. Randle has spent much of his life in the study of all aspects of the UFO phenomena. He has actively investigated cattle mutilations, abductions, crash retrievals and a wide variety of flying saucer sightings with photographic and physical evidence. He has traveled extensively during his investigations, interviewed many of the high-profile researchers and hundreds of witnesses to UFO events. He was among the first to review the Project Blue Book files after they were declassified and saw them before the names had been redacted.  Randle has appeared in dozens of documentaries including the \"Netflix\" \"Unsolved Mysteries\" special about Roswell. He has written dozens of books on the topic including published \"Roswell in the 21st Century,\" \"Understanding Roswell,\" \"Levelland\", \"The Washington Nationals,\"  \"Encounter in the Desert\" and most recently, \"1973: A Time of UFO Sightings, Landings and Abductions.\" His blog, A Different Perspective www.kevinrandle.blogspot.com provides insights into some of the most controversial and some of the best UFO sightings. There you can find a link to hundreds of interviews that he has conducted over the last five years.  He also provides a short weekly segment about UFOs on Coast-to-Coast AM hosted by George Noory. His interest in science fiction began with the movie \"Earth vs the Flying Saucers\" and expanded from there. He, along with friend Robert Cornett, teamed up to write science fiction including t  \"Remember the Alamo?\" and  \"Seeds of War.\" Both became limited series. Since then he has continued writing science fiction including the recently published \"The Interplanetary Defense Force\" and \"On the Second Tuesday of Next Week.\" He has just completed \"The Asteroid,\" which examines the problems of a crew on a space craft when the Earth is devastated by a huge asteroid. He has been a lifetime member of SFWA since the 1990s."}, "6300": {"n": "Audra Angelique", "s": "Archon community, programming and media.", "b": ""}, "6316": {"n": "Fran Wilde", "s": "Author Guest of Honor. Nebula and Norton award winning fantasy author: Updraft, Riverland.", "b": ""}, "6319": {"n": "Joy Alyssa Day", "s": "Artist Guest of Honor. Reverse painting on glass and blown glass art, often with space themes.", "b": ""}, "6320": {"n": "David Mack", "s": "NYT bestselling author of 40 novels, many Star Trek; wrote for Deep Space Nine.", "b": "David Mack is the New York Times bestselling author of forty novels of science fiction, fantasy, and adventure. His writing credits span many media, including television (for episodes of Star Trek: Deep Space Nine ), audio drama ( Star Trek: Khan ), and comic books. He has worked as a consultant for Star Trek: Prodigy , and in 2022 the International Association of Media Tie-in Writers honored him as a Grandmaster with its Faust Award. He resides in New York City."}, "6347": {"n": "Larry Niven", "s": "Author Guest of Honor. Hugo and Nebula winning SF author: Ringworld, the Known Space stories, The Mote in God's Eye.", "b": ""}, "6358": {"n": "John Krabbe", "s": "Special-ed teacher and author with a theatrical bent; three books.", "b": "I've worked in Special Education for many years. Initially, I was certain that my future was on a stage or in front of a camera. And thankfully, the Lord had other plans. I come from a family of staunch storytellers, and I've always had a proclivity to the theatrical. Realizing that I could apply that theatrical nature not only in the classroom, but in my writing as well, has greatly influenced the way I write words and characters onto paper. In the first quarter-century of my life, I met the Lord, bought a home, married my best friend, wrote three books, and began raising a child."}, "6361": {"n": "Jeanna Crawford", "s": "LA model builder and creature-shop veteran (Men in Black, Ed Wood); helped build the first Monty Python website.", "b": "St. Louis native Jeanna Crawford moved to Los Angeles in 1988, with the rest of the St. Louis Firehouse crew. Entertaining shenanigans since then have included helping develop the first Official Monty Python website in 1996 PythOnline.com Additional credits include (but not limited to) Film: Ed Wood -modelbuilder fly over sequence miniature - Boyington Productions Men In Black - creature shop MEFX/Rick Baker Brahm Stoker’s Dracula -Fantasy II FX Bicentennial Man - suit fabrication- XFX Vampires Los Muertos - Fantasy II The Attack of the 50’ Woman - Fantasy II Mom and Dad Save the World - modelbuilder- Dave Sharp Productions Con Air -tattoos- Fantasy II True Lies - miniatures - Fantasy II The Mothman Prophecies- miniatures-Fantasy II The Guyver - miniatures - Screaming Mad George The Beast - MEFX Kung Fu Rascals - Steve Wang directed Necronomicon: Book of the Dead - Fantasy II Hard Rain - 4 Ward Productions TV Amazing Live Sea Monkeys - Chiodo Bros Land Of The Lost (2009) -Chiodo Bros Sweet Valley High Attila The Rebel Highway Series Directors Ralph Bakshi/Robert Rodriguez/Joe Dante/Mary Lambert, etc. Video Games Monty Python’s Quest For The Holy Grail Monty Python’s Complete Waste of Time Here are a few references: Listed on IMDB, with different spellings: https://www.imdb.com/name/ nm11403572/?_ssoLoop=1 https://www.ericidle.com/blog/ one-hundred-years-of- pythonline/ https://cinemaone.net/actor/ 2301917"}, "6371": {"n": "Christopher Miskimon", "s": "Likely: military history writer and book reviewer for HistoryNet and Warfare History Network.", "b": ""}, "6390": {"n": "Joe Rauscher", "s": "National Space Society policy adviser; space solar power advocate.", "b": "SPACE COMMUNITY EXPERIENCE: National Space Society: - Policy Committee Leadership Group - Advisor (2021 – present) - Space Solar Power Program Manager (2021 – 2022) - Ad Astra Magazine - Advertising Contact (2014 – 2025) - Chair, Development Committee (2019 – 2021) - Regional Director, Region 7 (2020 – 2022) - Active member for several decades and Alliance for Space Development team member on visits to Congressional members and staff. The Planetary Society – Active member for several decades, and in early 2000s served as Washington Area Regional Coordinator"}, "6428": {"n": "Daniel Robb", "s": "Likely: licensed counselor in St. Charles, MO, working with depression and anxiety.", "b": ""}, "6430": {"n": "Max Camero", "s": "", "b": ""}, "6468": {"n": "Yes Please, With Monsters Podcast", "s": "Podcast by three librarians about monster, alien and paranormal romance.", "b": ""}, "647": {"n": "Sandy Pettinger", "s": "Award-winning masquerade costumer (four Worldcon Best of Show) and masquerade judge.", "b": "Sandy, with her husband, Pierre, has been costuming for forty years. She has won multiple awards, including four Worldcon Best of Shows. Sandy has judged many masquerades, including both F/SF and Historical. Shee was the Corresponding Secretary of the International Costumers’ Guild for a year and serves to this day as an assistant Archivist. She was the co-chair of Costume-Con 10 and a Division Head of the 2012 World Science Fiction convention, Chicon 7. She and Pierre were presented the ICG’s Lifetime Achievement Award in 2000. They were Fan Guests of Honor at the San Jose World Science Fiction Convention in 2018."}, "650": {"n": "Zo Allen", "s": "Archon pro liaison and programming; writer of short fiction.", "b": "Back from six years on stunning (and stunningly expensive) Cape Cod, I am back home and doing less writing and more moving. I'm also happily running the GOH group and assisting with Programming and taking part in panels. I have a few writing projects on the back burner and once I get settled in a new space, I anticipate finishing the polishing on my novella, and getting back onto the novel. I also have a couple of short stories in mind (at least one in my favorite genre) and as soon as life stops happening in stressful ways, I'm back on task. Looking forward to seeing everyone this year as I run around the convention center on missions. If you see me, grab a hug in passing."}, "670": {"n": "Donna J. W. Munro", "s": "Former history teacher turned horror and dark fantasy writer; Poppet Cycle novels.", "b": "Donna J. W. Munro taught high schoolers the slippery truths of government and history for twenty-five years and only retired because she wanted to write full time. Her students are still her greatest inspiration. She lives with four spooky cats, a cute curly-haired dog, a fur-covered husband, and an encyclopedia son. Her daughter is off saving the world. Donna’s short stories are published in It Calls from the Forest, HERitage Vol. 1 & 2, Pseudopod 752, Shakespeare Unleashed, Novus Monstrum, ParABnormal, and many more. Check out her novels, Revelation: Poppet Cycle Book 1, Runaway: PCB2, and Revolution: PCB3 as well as her first short story collection, Dark Workings of Wild Women. Her shared world cosmic cat adventure, Blue Plate Special (Dark Reflections Series), will challenge the fabric of time and space starting in November of 2025. Chasing Chimera is the first novel in a new series about witches and serial killers. It’s coming for you in 2026. Her website has a complete list of works at https://www.donnajwmunro.net/."}, "677": {"n": "Mike Phoenix", "s": "Playwright and retired St. Louis English and CS teacher.", "b": "Born in Kansas but raised in Portland, Oregon, Mike earned a BA in English from the University of Oregon in 1977. After work as a copy-aide and free-lance writer for the Oregon Journal newspaper in Portland, he returned to the Midwest to earn an MFA in Theater in 1985 from the University of Southern Illinois at Carbondale. He saw his original plays presented in Carbondale and Aurora, IL; Starkville, MS; Toronto, ONT; Arcata and San Francisco, CA; Portland, OR and St. Louis, MO. He directed six, main stage theater productions at Kirkwood High School in Kirkwood, Missouri, and taught remedial writing and college composition at St. Louis Community College at Meramec. Following 31 years with St. Louis Public Schools as an English Teacher, Professional Development Manager, and Computer Science Instructor, Phoenix retired in 2024. He returned for an additional year as a retired teacher for 24-25. Mike earned his Doctorate in Education from the University of Missouri at St. Louis in 2016. Going on 27 years, Phoenix continues to edit the bi-monthly newsletter of a local comic book fan club, SAGA. Phoenix plays electric blues guitar, draws comics, writes, and writes about the history of local, St. Louis fandom. He and his wife Rebecca have three children, three grandchildren, and have made their home in St. Louis since 1988."}, "692": {"n": "Brian Katcher", "s": "YA author; Stonewall Award winner (Almost Perfect) and a con romance novel.", "b": "Brian Katcher is the award-winning author of the YA con romance, THE IMPROBABLE THEORY OF ANA AND ZAK. He's also writen ALMOST PERFECT, winner of the 2011 Stonewall Book Award, along with several other titles. He's been coming to archon for over 30 years."}, "695": {"n": "David Von Allmen", "s": "SF/F short story writer (Escape Pod, Deep Magic); Baen Fantasy Adventure Award winner.", "b": "It wasn’t until David von Allmen’s high school professor thought one of his short stories was suspiciously high in literary merit and threatened to have him expelled for plagiarism that he realized he just might have the talent to be a real writer. David’s writing has appeared in Escape Pod, New Myths, Deep Magic, and other professional publications, and has been published in Chinese translation. David is a past winner of the Baen Fantasy Adventure Award. He lives in his hometown of St. Louis with his children, Lucas and Eva, who write some pretty darn good stories of their own. Links to his works can be found at davidvonallmen.com."}, "7": {"n": "Christine Amsden", "s": "Award-winning fantasy/SF novelist (Cassie Scot series); editor and disability advocate.", "b": "Christine Amsden is the author of nine award-winning fantasy and science fiction novels, including the Cassie Scot Series. Speculative fiction is fun, magical, and imaginative but Christine believes great speculative fiction is about real people defining themselves through extraordinary situations. She writes primarily about people, and it is in this way that she strives to make science fiction and fantasy meaningful for everyone. In addition to writing, Christine is a freelance editor and political activist. Disability advocacy is of particular interest to her; she has a rare genetic eye condition called Stargardt Macular Degeneration and has been legally blind since the age of eighteen. In her free time, she enjoys role playing, board games, and a good cup of tea. She lives in the Kansas City area with her husband and two kids."}, "740": {"n": "Matthew Edward Munro Wagenblast", "s": "", "b": ""}, "750": {"n": "Patricia McFadden", "s": "Archon programming chair.", "b": ""}, "757": {"n": "David Benem", "s": "Epic fantasy author exploring the darker side of heroism.", "b": "David Benem is an epic fantasy author who enjoys fantasy fiction that explores the darker side of heroism, the complexities of character, and conflicts where the \"good guys\" don't always prevail. David's written numerous short stories and is presently hard at work on the final installment of his epic fantasy trilogy, A Requiem for Heroes."}, "770": {"n": "John Hornor Jacobs", "s": "Award-winning literary horror author: A Lush and Seething Hell, Southern Gods.", "b": "John Hornor Jacobs is the award-winning author of genre-blurring fiction that explores horror, crime, and the uncanny with emotional depth and literary precision. His most recent novel, The Night That Finds Us All (Putnam, 2025), is a dark nautical horror story about a haunted sailboat, a cursed voyage across the Atlantic, and a sailor unraveling in sobriety and isolation. Tense, terrifying, and darkly funny, it showcases Jacobs at the height of his powers. He is the author of A Lush and Seething Hell, a collection of two literary horror short novels that was shortlisted for both the World Fantasy and Shirley Jackson Awards and has been optioned for television. Murder Ballads and Other Horrific Tales, his newest collection, gathers ten stories—two previously unpublished—including a sequel to Southern Gods. Traversing crime noir, folk horror, and speculative dread, it further cements Jacobs as, in the words of Daniel Kraus, “a major author.” Jacobs' debut novel Southern Gods was a finalist for the Bram Stoker Award and winner of the Darrell Award. Set in the haunted South, it blends cosmic horror and blues mythology in a story that first marked Jacobs as a unique voice in modern horror. He is also the author of This Dark Earth (Simon & Schuster), the Twelve-Fingered Boy YA trilogy, and the Incorruptibles fantasy series, the first volume of which was nominated for the Morningstar and Gemmell Awards. His short fiction and essays have appeared in Playboy, Southwest Review, Cemetery Dance, Apex Magazine, and The Continental Literary Magazine. Jacobs is also a screenwriter and co-creator of the upcoming narrative podcast The Listening Station. His work continues to evolve across media and genre, but always remains rooted in the dark territories of the human heart."}, "790": {"n": "Anna Mulch", "s": "Alcohol ink artist: vibrant, abstract panels, often inspired by music. Hosts community art events.", "b": ""}, "792": {"n": "Cindi Gille-Rowley", "s": "", "b": ""}, "805": {"n": "Angela Williams", "s": "Archon regular since 1980 and longtime con volunteer; high school teacher.", "b": "I have attended Archon since 2 friends brought me to my first con in 1980.  I may have missed 3 conventions since then, but I was always at the Con in spirit.  Over the years at the Con, I have volunteered and helped in various departments and currently still do.  That Archon volunteering prepared me for being in charge of departments for other conventions in St. Louis in the late 80's into the mid 90's. Currently, in the real world, I am a teacher.  I've been teaching since 2015.  I started teaching in elementary school and then became a high school teacher in 2019.  I teach in the curriculum area of Career Technical Education. What did I do before I started teaching? It would take more than a minute to tell you here."}, "815": {"n": "Sela Carsen", "s": "Paranormal and sci-fi romance author; folklore and fairytale nerd.", "b": "Sela Carsen is an award-winning author of paranormal and sci-fi romance — with or without sex and dead bodies. Your pick. She maintains a permanent nerd-on for fairytales and mythology, and openly hoards reference books about obscure folklore. Born a wanderer, she and her family have finally settled in the Midwest. Until they move again, at least. (Surprise! We've moved to another spot in the Midwest, but still close enough to Archon that I'll be coming back forever...)"}, "837": {"n": "Jennifer Stolzer", "s": "Author/illustrator of a dozen books, YA to picture books.", "b": "Jennifer Stolzer is an author/illustrator who creates bright and engaging characters both in artwork and prose. She’s authored over a dozen books from YA to Picture Books. Find her at jenniferstolzer.com."}, "845": {"n": "George Sirois", "s": "YA SF author (Excelsior), audiobook narrator and Marvel podcaster.", "b": "George Sirois is the author of the international bestselling young adult / science-fiction novel Excelsior, its two sequels, and the science-fiction / sports trilogy From Parts Unknown. He served as President of the Missouri Writers Guild from 2017-2018, overseeing two annual conferences and speaking for various chapters. In 2016, he officially became an audiobook narrator when he narrated the first Excelsior novel, and has since lent his voice to over twenty books of varying genres. He began podcasting in 2018, and is now the host and producer of the podcasts Excelsior Journeys: The Road to Creativity, From Duck Till Dark: Outside the Marvel Studios, and Excelsior Journeys: Behind the Scenes. In March 2023, George adapted his novel Excelsior into a two-hour-long audio drama, which was performed live on the Clubhouse app with a full cast, a sound effects library, and a musical score. In 2025, he became a multi-award-winning screenwriter with the short science-fiction screenplays \"Minus One Plus\" and “P.O.O.L.,” both of which have been selected to participate in film festivals all around the world. A New Yorker since birth, George now lives in St. Louis, Missouri with his wife and daughter. For more information, please visit www.hesgotit.com."}, "87": {"n": "Douglas Ferguson", "s": "20+ years at Wizards of the Coast and The Pokémon Company; now building original worlds.", "b": "Doug \"Conall\" Ferguson is a Las Vegas-based creative with 20+ years of bringing games, characters, and worlds to life — driven by a lifelong passion for SF&F, comics, and gaming. From behind the counter of The Raven's Loft to an epic 20+ year journey at Wizards of the Coast and The Pokémon Company, he helped grow some of the most beloved IPs in the hobby. These days he's focused on building original worlds and characters from the ground up."}, "870": {"n": "Alan DeVaughan", "s": "Lifelong SF/F reader and Archon attendee since Archon 10.", "b": "I’ve been interested in reading science fiction and fantasy since I was a kid.  My first true science fiction book was probably one of Isaac Asimov’s Lucky Starr series.  My dad was a science fiction reader and he gave me David Starr, Space Ranger when I was seven.  I read every Asimov book my dad had along with anything else in his library such as Starship Troopers, Ringworld, and others.  My introduction to fantasy was The Hobbit and the Lord of the Rings trilogy.  I didn’t read much fantasy until a friend in middle school introduced me to the Dragonriders of Pern series.  That led to authors such as David Eddings, Janny Wurts, Stephen R. Donaldson, etc.  I’ve been an avid reader ever since. I didn’t know science fiction/fantasy conventions were a thing until my dad told me about them.  I came with him to Archon 10 and was amazed that famous authors (Frederick Pohl!) would hang around and talk to regular folks – especially a teenager like me.  I was introduced to a wonderful, and a bit strange, world that was open to anyone. I was a volunteer for Archon 17 & 18.  From Archon 19 through Archon 26 I was Con HQ staff.  I ran Con HQ from Archon 27 through Archon 39.  I served as the Pro Liaison from Archon 32 through Archon 37.  I served as Con Chair from Archon 40 through Archon 45.  I was honored to be the Fan Guest of Honor for Archon 46."}, "872": {"n": "Scott Corwin", "s": "", "b": ""}, "892": {"n": "Neko Pilarcik-Tellez", "s": "Animator (Hit-Monkey, Harold and the Purple Crayon); Emmy-nominated student short.", "b": "Neko Pilarcik-Tellez is an animator and compositor whose credits include \"Marvel’s Hit-Monkey”, “Harold and the Purple Crayon\", and “Five Nights at Freddy’s: Sister Location”. Her student Emmy nominated short film, \"The Pope’s Dog\", screened internationally and won Best in the South at ASIFAC 2024. She currently works full-time as an animator at Affinitiv Advertising while co-directing her next film, “Pixipals”, a pixel art / live action horror short about an insecure young woman who becomes obsessed with a vintage virtual pet game and ends up in a fight for her sanity versus the controlling digital creature."}, "955": {"n": "John Sies", "s": "SF/F artist: spacescapes, fractal art and humorous cartoons in ink, colored pencil and Photoshop. Puts together the Archon program book.", "b": ""}, "97": {"n": "Cole Lanahan", "s": "Literary agent at The Seymour Agency.", "b": "Cole Lanahan is a literary agent with The Seymour Agency, where she represents a wide range of fiction and nonfiction authors. With a background in nonprofit leadership, marketing, and advocacy, she brings a strategic eye for storytelling and audience building to her work with writers. Cole is passionate about championing distinctive voices and helping authors shape projects that connect with readers in meaningful ways."}}</script>
<script>
(() => {
  const EVENTS = JSON.parse(document.getElementById('data').textContent);
  const PEOPLE = JSON.parse(document.getElementById('people').textContent);
  const GREN = 'https://sites.grenadine.co/sites/archon/en/archon-49';
  const open = new Set();
  const HOURS = [
    ["Registration","Rotunda, Gateway","Thu 7-10pm · Fri/Sat 9am-11:45pm · Sun 9am-2pm"],
    ["Con HQ","North Hall, Gateway","Fri/Sat 9am-midnight · Sun 10am-5pm"],
    ["Dealer's Room","Center Hall A, Gateway","Fri 4-8pm · Sat 10am-6pm · Sun 10am-2pm"],
    ["Art Show","Ballroom A, Gateway","Fri 10am-9pm · Sat 10:30am-4pm · Sun 10:30am-noon"],
    ["Fan Lounge","Prefunction Area, Gateway","Fri noon-9pm · Sat/Sun 9am-4pm"],
    ["Hospitality","Clinton A&B, DoubleTree","Fri/Sat 10am-2:30am · Sun 10am-4pm"],
    ["Gaming Registration","North Hall, Gateway","Fri/Sat 9am-10pm · Sun 9am-1pm"],
    ["Gaming","Madison A&B, DoubleTree","Open gaming 24 hrs · Library Fri 1pm-1am, Sat 9am-1am, Sun 10am-2pm"],
    ["Children's Programming","Salon 5, Gateway","Fri 3-6:50pm · Sat 10am-6:50pm · Sun 10am-1:50pm"],
    ["Programming Office","Illini B, Gateway","Thu 6-7:30pm · Fri 10am-7pm · Sat 9am-5pm · Sun 9am-noon"],
    ["Dance","Madison C&D, DoubleTree","Fri/Sat 9pm-2am"],
    ["Masquerade","Center Hall B, Gateway","Sat 8pm · seating 7:20pm"],
  ];
  document.getElementById('hours').innerHTML = HOURS.map(h => `<div><b>${h[0]}</b><span>${h[1]}</span><span>${h[2]}</span></div>`).join('');

  const DAYS = ["Friday","Saturday","Sunday"];
  const mins = t => { const [, h, m, ap] = t.match(/(\d+):(\d+) (AM|PM)/); return (+h % 12 + (ap === 'PM' ? 12 : 0)) * 60 + +m; };
  const keyOf = e => (e.day + '|' + e.time + '|' + e.title).toLowerCase().replace(/[^a-z0-9|]+/g, '-');
  EVENTS.forEach(e => {
    e.key = keyOf(e); e.m = mins(e.time);
    e.cats = e.category ? e.category.split(', ') : ['Special Event'];
    e.youth = e.kids || e.cats.includes('Teen');
    e.hay = (e.title + ' ' + e.panelists + ' ' + e.location + ' ' + e.desc + ' ' + e.category + ' ' + (e.extra || '') + ' ' +
      e.ppl.map(([p]) => PEOPLE[p].n + ' ' + PEOPLE[p].s).join(' ')).toLowerCase();
  });
  EVENTS.sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.m - b.m);
  const byKey = Object.fromEntries(EVENTS.map(e => [e.key, e]));
  const eventsOf = {};
  EVENTS.forEach(e => e.ppl.forEach(([p]) => (eventsOf[p] = eventsOf[p] || []).push(e)));

  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  let state = store.get('archon49-picks') || { picks: {}, updatedAt: 0 };
  function skipKidsTrack() {
    if (state.kidsSkipped) return false;
    EVENTS.filter(e => e.kids).forEach(e => { state.picks[e.key] = 'skip'; });
    state.kidsSkipped = true; state.updatedAt = Date.now();
    store.set('archon49-picks', state);
    return true;
  }
  const FRIEND_SEED = { p: [], k: [] };
  if (!state.friends) { state.friends = { p: FRIEND_SEED.p.slice(), k: [] }; state.updatedAt = Date.now(); store.set('archon49-picks', state); }
  const SEED_GO = [];
  function seedPicks() {
    const done = state.seeded || [];
    const todo = SEED_GO.filter(k => !done.includes(k));
    if (!todo.length) return false;
    todo.forEach(k => { if (byKey[k]) state.picks[k] = 'go'; });
    state.seeded = [...done, ...todo]; state.updatedAt = Date.now();
    store.set('archon49-picks', state);
    return true;
  }
  seedPicks();
  const isFriend = p => state.friends.p.includes(p);
  const friendsOn = e => [
    ...e.ppl.filter(([p]) => isFriend(p)).map(([p]) => PEOPLE[p].n),
    ...FRIEND_SEED.k.filter(k => (e.title + ' ' + e.panelists + ' ' + (e.extra || '')).toLowerCase().includes(k.toLowerCase())),
  ];
  const ui = Object.assign({ day: 'All', view: 'All', q: '', cat: '', kids: false, compact: false, who: 'open' }, store.get('archon49-ui') || {});

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const VIEWS = [['All','All'],['friends','★ Friends'],['Unsorted','Unsorted'],['go','Going'],['maybe','Maybe'],['keep','Going + Maybe'],['skip','Skipped']];

  const seg = (el, items, cur, on) => {
    el.innerHTML = items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('');
    el.onclick = ev => { const b = ev.target.closest('button'); if (b) on(b.dataset.v); };
  };
  const cats = [...new Set(EVENTS.flatMap(e => e.cats))].sort();
  const catSel = document.getElementById('cat');
  catSel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');

  function matches(e) {
    const s = state.picks[e.key];
    if (ui.day !== 'All' && e.day !== ui.day) return false;
    if (!ui.kids && e.youth && ui.cat !== "Children's Programming" && ui.cat !== 'Teen') return false;
    if (ui.cat && !e.cats.includes(ui.cat)) return false;
    if (ui.view === 'Unsorted' && s) return false;
    if (ui.view === 'friends' && !friendsOn(e).length) return false;
    if (ui.view === 'keep' && s !== 'go' && s !== 'maybe') return false;
    if (['go','maybe','skip'].includes(ui.view) && s !== ui.view) return false;
    if (ui.q && !ui.q.toLowerCase().split(/\s+/).every(w => e.hay.includes(w))) return false;
    return true;
  }

  function clashes(e) {
    if (state.picks[e.key] !== 'go') return [];
    return EVENTS.filter(o => o !== e && o.day === e.day && o.m === e.m && state.picks[o.key] === 'go');
  }

  function slotCount(e, v) {
    return EVENTS.filter(o => o.day === e.day && o.m === e.m && state.picks[o.key] === v).length;
  }
  function showWho(e) {
    const s = state.picks[e.key];
    if (!e.ppl.length || s === 'skip' || ui.who === 'tap') return false;
    if (ui.who === 'always') return true;
    return slotCount(e, 'go') + slotCount(e, 'maybe') !== 1;
  }
  function personDetail(e, p) {
    const P = PEOPLE[p];
    const also = (eventsOf[p] || []).filter(o => o !== e);
    return `<div class="pdetail">
      ${P.b ? `<p>${esc(P.b)}</p>` : `<p class="nobio">No bio on the Archon site yet.</p>`}
      ${also.length ? `<div class="also">Also on: ${also.map(o => `<b>${o.day.slice(0,3)} ${o.time}</b> ${esc(o.title)}`).join(' · ')}</div>` : ''}
      <button type="button" class="fbtn" data-friend="${p}">${isFriend(p) ? 'Remove from friends' : '★ Mark as friend'}</button>
      <a href="${GREN}/people/${p}" target="_blank" rel="noopener">Archon profile</a>
    </div>`;
  }
  function pplHTML(e) {
    const extra = e.extra ? `<div class="ppl">${esc(e.extra)}</div>` : '';
    return extra + pplCore(e);
  }
  function pplCore(e) {
    if (!e.ppl.length) return e.panelists ? `<div class="ppl">${esc(e.panelists)}</div>` : '';
    const btn = (p, mod) => `<button type="button" class="pname${isFriend(p) ? ' is-friend' : ''}" data-p="${p}" aria-expanded="${open.has(e.key + '|' + p)}">${esc(PEOPLE[p].n)}</button>${mod ? ' <span class="mod">(mod)</span>' : ''}`;
    if (!showWho(e)) {
      const opened = e.ppl.filter(([p]) => open.has(e.key + '|' + p));
      return `<div class="ppl">${e.ppl.map(([p, m]) => btn(p, m)).join(', ')}</div>` +
        (opened.length ? `<ul class="who-list">${opened.map(([p]) => `<li><b>${esc(PEOPLE[p].n)}</b> <span class="sum">${esc(PEOPLE[p].s)}</span>${personDetail(e, p)}</li>`).join('')}</ul>` : '');
    }
    return `<ul class="who-list">${e.ppl.map(([p, m]) => {
      const P = PEOPLE[p], k = e.key + '|' + p;
      return `<li>${btn(p, m)} ${P.s ? `<span class="sum">${esc(P.s)}</span>` : `<span class="nobio">no bio posted</span>`}${open.has(k) ? personDetail(e, p) : ''}</li>`;
    }).join('')}</ul>`;
  }
  function evHTML(e) {
    const s = state.picks[e.key] || '';
    const tags = e.cats.map(c => `<span class="tag${c === 'GOH' ? ' goh' : ''}">${c === 'GOH' ? 'Guest of Honor' : esc(c)}</span>`).join('');
    const dt = /DoubleTree/.test(e.location);
    const room = esc(e.location.replace(/ - (Gateway Center|DoubleTree)$/, ''));
    const c = clashes(e), fr = friendsOn(e);
    return `<article class="ev" data-k="${e.key}" data-s="${s}">
      <div class="ev-head"><h3>${esc(e.title)}</h3>
        <div class="picks" role="group" aria-label="Sort ${esc(e.title)}">
          ${[['go','Going'],['maybe','Maybe'],['skip','Skip']].map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${s === v}">${l}</button>`).join('')}
        </div></div>
      <div class="meta"><span class="room${dt ? ' dt' : ''}">${room}</span>${e.end ? `<span class="until">until ${e.end}</span>` : ''}${e.custom ? '<span class="tag mine">Added</span>' : ''}${tags}${fr.length ? `<span class="friend">★ ${fr.map(esc).join(', ')}</span>` : ''}</div>
      ${pplHTML(e)}
      ${e.desc ? `<p class="desc">${esc(e.desc)}</p>` : ''}
      ${e.sid ? `<a class="gl" href="${GREN}/schedule/${e.sid}" target="_blank" rel="noopener">Open on Archon site</a>` : ''}
      ${c.length ? `<div class="clash">Also going to: ${c.map(o => esc(o.title)).join('; ')}</div>` : ''}
    </article>`;
  }

  function render() {
    store.set('archon49-ui', ui);
    seg(document.getElementById('days'), [['All','All'], ...DAYS.map(d => [d, d.slice(0,3)])], ui.day, v => { ui.day = v; render(); });
    seg(document.getElementById('views'), VIEWS, ui.view, v => { ui.view = v; render(); });
    catSel.value = ui.cat;
    document.getElementById('kids').checked = ui.kids;
    document.getElementById('compact').checked = ui.compact;
    document.getElementById('whomode').value = ui.who;
    const bits = [];
    if (ui.day !== 'All') bits.push(ui.day.slice(0, 3));
    if (ui.view !== 'All') bits.push(VIEWS.find(v => v[0] === ui.view)[1]);
    if (ui.cat) bits.push(ui.cat);
    if (ui.q) bits.push('"' + ui.q + '"');
    document.getElementById('fsum').textContent = bits.length ? '· ' + bits.join(' · ') : '';
    requestAnimationFrame(setDeckH);
    document.getElementById('list').classList.toggle('compact', ui.compact);

    const shown = EVENTS.filter(matches);
    let html = '', day = null, slot = null;
    for (const e of shown) {
      if (e.day !== day) { if (slot) html += '</div></section>'; slot = null; day = e.day; html += `<h2 class="day">${day}</h2>`; }
      if (e.time !== slot) { if (slot) html += '</div></section>'; slot = e.time; html += `<section class="slot" id="slot-${e.day}-${e.m}" data-day="${e.day}" data-m="${e.m}"><time>${e.time}</time><div class="events">`; }
      html += evHTML(e);
    }
    if (slot) html += '</div></section>';
    document.getElementById('list').innerHTML = html || `<div class="empty">Nothing matches these filters.</div>`;

    const n = { go: 0, maybe: 0, skip: 0 };
    Object.entries(state.picks).forEach(([k, v]) => { if (byKey[k] && n[v] !== undefined) n[v]++; });
    const uns = EVENTS.length - n.go - n.maybe - n.skip;
    document.getElementById('tally').innerHTML =
      `<span class="t-go">${n.go} going</span><span class="t-maybe">${n.maybe} maybe</span><span class="t-skip">${n.skip} skipped</span><span>${uns} unsorted</span><span>${shown.length} shown</span>`;
  }

  document.getElementById('list').addEventListener('click', ev => {
    const fb = ev.target.closest('.fbtn');
    if (fb) {
      const p = fb.dataset.friend, f = state.friends;
      f.p = isFriend(p) ? f.p.filter(x => x !== p) : [...f.p, p];
      state.updatedAt = Date.now(); store.set('archon49-picks', state); queueSave(); render();
      return;
    }
    const pn = ev.target.closest('.pname');
    if (pn) {
      const k = pn.closest('.ev').dataset.k + '|' + pn.dataset.p;
      open.has(k) ? open.delete(k) : open.add(k);
      const y = pn.getBoundingClientRect().top;
      render();
      const nb = document.querySelector(`.ev[data-k="${k.split('|').slice(0, -1).join('|')}"] .pname[data-p="${pn.dataset.p}"]`);
      if (nb) { window.scrollBy(0, nb.getBoundingClientRect().top - y); nb.focus({ preventScroll: true }); }
      return;
    }
    const b = ev.target.closest('.picks button'); if (!b) return;
    const k = b.closest('.ev').dataset.k, v = b.dataset.v;
    if (state.picks[k] === v) delete state.picks[k]; else state.picks[k] = v;
    state.updatedAt = Date.now();
    store.set('archon49-picks', state);
    queueSave();
    const y = b.getBoundingClientRect().top;
    render();
    const nb = document.querySelector(`.ev[data-k="${k}"] .picks button[data-v="${v}"]`);
    if (nb) { window.scrollBy(0, nb.getBoundingClientRect().top - y); nb.focus({ preventScroll: true }); }
  });
  let qt; document.getElementById('q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { ui.q = ev.target.value.trim(); render(); }, 150); });
  document.getElementById('q').value = ui.q;
  catSel.onchange = () => { ui.cat = catSel.value; render(); };
  document.getElementById('kids').onchange = ev => { ui.kids = ev.target.checked; render(); };
  document.getElementById('compact').onchange = ev => { ui.compact = ev.target.checked; render(); };
  document.getElementById('whomode').onchange = ev => { ui.who = ev.target.value; render(); };

  function myList() {
    return EVENTS.filter(e => state.picks[e.key] === 'go' || state.picks[e.key] === 'maybe');
  }
  function asText() {
    let out = 'ARCHON 49 - My schedule\n', day = null;
    for (const e of myList()) {
      if (e.day !== day) { day = e.day; out += `\n${day.toUpperCase()}\n`; }
      out += `${e.time.padStart(8)}  ${e.end ? '(until ' + e.end + ') ' : ''}${state.picks[e.key] === 'maybe' ? '(maybe) ' : ''}${e.title} - ${e.location.replace(/ - (Gateway Center|DoubleTree)$/, (m, v) => v === 'DoubleTree' ? ' (DoubleTree)' : '')}\n`;
    }
    return out;
  }
  function asHTML() {
    let rows = '', day = null;
    for (const e of myList()) {
      if (e.day !== day) { day = e.day; rows += `<tr><th colspan="3">${day}</th></tr>`; }
      const mb = state.picks[e.key] === 'maybe';
      rows += `<tr class="${mb ? 'mb' : ''}"><td class="t">${e.time}${e.end ? '<br><small>to ' + e.end + '</small>' : ''}</td><td><b>${esc(e.title)}</b>${mb ? ' <i>(maybe)</i>' : ''}${e.panelists ? `<br><small>${esc(e.panelists)}</small>` : ''}</td><td>${esc(e.location)}</td></tr>`;
    }
    return `<!doctype html><html><head><meta charset="utf-8"><title>Archon 49 - My Schedule</title><style>
body{font:11pt/1.35 Georgia,serif;margin:0.5in;color:#111}h1{font:700 16pt Arial,sans-serif;margin:0 0 8px}
table{border-collapse:collapse;width:100%}th{text-align:left;font:700 12pt Arial,sans-serif;padding:14px 0 4px;border-bottom:2px solid #111}
td{padding:5px 8px 5px 0;border-bottom:1px solid #ccc;vertical-align:top}td.t{white-space:nowrap;font-family:monospace;width:70px}
tr.mb td{color:#555}small{color:#555}@media print{tr{break-inside:avoid}}</style></head><body>
<h1>Archon 49 - My Schedule</h1><table>${rows}</table></body></html>`;
  }
  const syncEl = document.getElementById('sync');
  document.getElementById('copy').onclick = () => {
    if (!myList().length) { syncEl.textContent = 'Mark some events Going or Maybe first.'; return; }
    const text = asText();
    navigator.clipboard.writeText(text).then(() => { syncEl.textContent = 'Copied. Paste it into Notes, Docs, or an email.'; })
      .catch(() => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'width:100%;height:200px'; document.querySelector('.deck').appendChild(ta); ta.select(); syncEl.textContent = 'Copy the selected text below.'; });
  };

  // Account sync: picks follow you to your phone when signed in.
  let db = null, ref = null, saving = false, pending = false, saveT;
  function queueSave() { if (!ref) return; clearTimeout(saveT); saveT = setTimeout(flush, 700); }
  async function flush() {
    if (!ref) return;
    if (saving) { pending = true; return; }
    saving = true;
    try { await ref.set({ picks: state.picks, updatedAt: state.updatedAt, kidsSkipped: !!state.kidsSkipped, friends: state.friends, seeded: state.seeded || [] }); syncEl.textContent = 'Picks saved to your account.'; }
    catch (err) { if (err && err.code === 'invalid_argument') { ref = null; syncEl.textContent = 'Picks save in this browser only.'; } else syncEl.textContent = 'Could not reach your account; picks are kept in this browser.'; }
    saving = false;
    if (pending) { pending = false; flush(); }
  }

  function setDeckH() {
    document.documentElement.style.setProperty('--deck-h', document.getElementById('deck').offsetHeight + 'px');
  }
  window.addEventListener('resize', setDeckH);
  const deck = document.getElementById('deck'), ft = document.getElementById('ftoggle');
  ft.onclick = () => {
    const o = !deck.classList.contains('open');
    deck.classList.toggle('open', o); ft.setAttribute('aria-expanded', o); setDeckH();
  };

  // Con runs Fri Oct 2 - Sun Oct 4, 2026, Central time.
  const CON_DATES = { '2026-10-02': 'Friday', '2026-10-03': 'Saturday', '2026-10-04': 'Sunday' };
  function centralNow() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, m: +p.hour * 60 + +p.minute };
  }
  const nowMsg = document.getElementById('nowmsg');
  document.getElementById('now').onclick = () => {
    const t = centralNow();
    let day = CON_DATES[t.date], m = t.m - 59;
    if (!day && t.m < 300 && CON_DATES[new Date(Date.parse(t.date) - 864e5).toISOString().slice(0, 10)]) {
      day = CON_DATES[new Date(Date.parse(t.date) - 864e5).toISOString().slice(0, 10)]; m = t.m + 24 * 60 - 59;
    }
    let note = '';
    if (!day) {
      if (t.date < '2026-10-02') { day = 'Friday'; m = 0; note = 'Con starts Friday. Showing the first events.'; }
      else { nowMsg.textContent = 'Archon 49 is over.'; return; }
    }
    if (ui.day !== 'All' && ui.day !== day) { ui.day = day; render(); }
    const slots = [...document.querySelectorAll(`.slot[data-day="${day}"]`)];
    const target = slots.find(el => +el.dataset.m >= m);
    if (!target) { nowMsg.textContent = `Nothing left ${day} in this view.`; return; }
    nowMsg.textContent = note;
    deck.classList.remove('open'); ft.setAttribute('aria-expanded', 'false'); setDeckH();
    requestAnimationFrame(() => {
      target.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
    });
  };

  render();

  (async () => {
    if (!window.claude?.use) {
      const b = document.getElementById('dl'); b.hidden = false;
      b.onclick = () => {
        if (!myList().length) { syncEl.textContent = 'Mark some events Going or Maybe first.'; return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([asHTML()], { type: 'text/html' }));
        a.download = 'archon49-my-schedule.html'; document.body.appendChild(a); a.click(); a.remove();
        syncEl.textContent = 'Saved. Open the file in a browser to print it.';
      };
      return;
    }
    try {
      const dl = await claude.use('downloads');
      if (dl) { const b = document.getElementById('dl'); b.hidden = false;
        b.onclick = () => { if (!myList().length) { syncEl.textContent = 'Mark some events Going or Maybe first.'; return; }
          dl.save({ filename: 'archon49-my-schedule.html', data: asHTML() }).then(() => { syncEl.textContent = 'Saved. Open the file in a browser to print it.'; }).catch(() => {}); }; }
    } catch {}
    try {
      const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = u ? await u.id() : null;
      if (!d || !id) return;
      db = d; ref = db.doc('data/users/' + id + '/picks');
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
        state = { picks: { ...(remote.picks || {}) }, updatedAt: remote.updatedAt, kidsSkipped: remote.kidsSkipped, friends: remote.friends || state.friends, seeded: remote.seeded || [] };
        store.set('archon49-picks', state);
        if (skipKidsTrack() | seedPicks()) flush();
        render();
      } else if (Object.keys(state.picks).length) { flush(); }
      syncEl.textContent = 'Picks sync to your account.';
    } catch { ref = null; }
  })();
})();
</script>
</body></html>
