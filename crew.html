<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Archon 49 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one sticky control deck over a single time-ordered program column; time sits in a left rail like a pocket program. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #16203a;
  --muted: #5b6478;
  --line: #d5dbe4;
  --accent: #0d7480;
  --accent-soft: #d6eef0;
  --go: #1f7a45;
  --go-soft: #dcf1e3;
  --maybe: #9a6200;
  --maybe-soft: #fbecc9;
  --skip: #8a8f9c;
  --warn: #b3361f;
  --font-display: "Syncopate", "Arial Black", sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1422; --surface: #171e30; --ink: #e6eaf2; --muted: #9aa3b6; --line: #2a3349;
    --accent: #4cc3cf; --accent-soft: #163a42; --go: #5fd08f; --go-soft: #173826;
    --maybe: #f0b54a; --maybe-soft: #3d2f12; --skip: #6b7285; --warn: #ff8a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1422; --surface: #171e30; --ink: #e6eaf2; --muted: #9aa3b6; --line: #2a3349;
  --accent: #4cc3cf; --accent-soft: #163a42; --go: #5fd08f; --go-soft: #173826;
  --maybe: #f0b54a; --maybe-soft: #3d2f12; --skip: #6b7285; --warn: #ff8a70; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-block-end: 14px; }
.brand { display: grid; gap: 2px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px); letter-spacing: 0.06em; margin: 0; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tally span { padding: 3px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.tally .t-go { color: var(--go); } .tally .t-maybe { color: var(--maybe); } .tally .t-skip { color: var(--skip); }

.deck-body { display: grid; gap: 8px; }
.deck-top { flex-wrap: nowrap; }
.btn.now { background: var(--accent); color: var(--surface); font-weight: 600; }
.btn.now:hover { background: var(--accent); filter: brightness(1.1); }
.ftoggle { display: none; }
.ftoggle #fsum { color: var(--muted); font-weight: 400; }
.now-msg { font-size: 12px; color: var(--muted); min-width: 0; }
.slot { scroll-margin-top: calc(var(--deck-h, 140px) + 8px); }
.slot.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .slot.flash { animation: none; } }
@media (max-width: 700px) {
  .ftoggle { display: inline-block; }
  .deck:not(.open) .deck-body { display: none; }
}
.deck { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-body); padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
input[type=search], select { font: 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
input[type=search] { flex: 1 1 180px; }
select { flex: 0 1 auto; max-width: 100%; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: 500 13px var(--font-body); color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
.btn:hover { background: var(--accent-soft); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status-line { font-size: 12px; color: var(--muted); min-height: 1.2em; }

details.info { margin-block: 14px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details.info summary { cursor: pointer; font-weight: 600; }
.hours { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 18px; margin-block-start: 10px; font-size: 13px; }
.hours div { min-width: 0; }
.hours b { display: block; }
.hours span { color: var(--muted); display: block; font-family: var(--font-mono); font-size: 12px; }

h2.day { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; margin: 28px 0 4px; color: var(--accent); }
.slot { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 14px; padding-block: 10px; border-bottom: 1px dashed var(--line); }
.slot time { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--muted); padding-top: 12px; font-variant-numeric: tabular-nums; position: sticky; top: calc(var(--deck-h, 130px) + 6px); align-self: start; }
.events { display: grid; gap: 8px; min-width: 0; }
.ev { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.ev[data-s="go"] { border-left-color: var(--go); background: linear-gradient(90deg, var(--go-soft), var(--surface) 60%); }
.ev[data-s="maybe"] { border-left-color: var(--maybe); background: linear-gradient(90deg, var(--maybe-soft), var(--surface) 60%); }
.ev[data-s="skip"] { opacity: 0.55; }
.ev[data-s="skip"] .desc, .ev[data-s="skip"] .ppl { display: none; }
.ev-head { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.ev h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; text-wrap: balance; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.goh { background: var(--ink); color: var(--bg); }
.room { font-weight: 500; color: var(--ink); }
.room.dt::after { content: " · DoubleTree"; color: var(--warn); font-weight: 600; }
.ppl { font-size: 13px; color: var(--muted); }
.who-list { list-style: none; margin: 2px 0 0; padding: 8px 10px; display: grid; gap: 6px; background: var(--bg); border-radius: 6px; font-size: 13px; }
.who-list li { min-width: 0; }
.who-list .sum { color: var(--muted); }
.who-list .nobio { color: var(--muted); font-style: italic; }
.pname { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.pname[aria-expanded="true"] { color: var(--accent); }
.ppl .pname { font-weight: 500; color: var(--muted); }
.mod { font-size: 10.5px; color: var(--muted); }
.pdetail { margin: 6px 0 2px; padding-left: 10px; border-left: 2px solid var(--accent); display: grid; gap: 6px; }
.pdetail p { margin: 0; max-width: 65ch; }
.pdetail .also { font-size: 12.5px; color: var(--muted); }
.pdetail .also b { color: var(--ink); font-weight: 500; }
.pdetail a, .ev a.gl { color: var(--accent); font-size: 12.5px; }
.desc { font-size: 13.5px; max-width: 65ch; margin: 0; }
.compact .desc { display: none; }
.picks { display: inline-flex; gap: 4px; flex: none; }
.picks button { font: 600 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.picks button[data-v="go"][aria-pressed="true"] { background: var(--go); border-color: var(--go); color: var(--surface); }
.picks button[data-v="maybe"][aria-pressed="true"] { background: var(--maybe); border-color: var(--maybe); color: var(--surface); }
.picks button[data-v="skip"][aria-pressed="true"] { background: var(--skip); border-color: var(--skip); color: var(--surface); }
.friend { font-size: 11px; font-weight: 600; color: var(--maybe); background: var(--maybe-soft); padding: 1px 7px; border-radius: 999px; }
.pname.is-friend::before { content: "★ "; color: var(--maybe); }
.fbtn { justify-self: start; font: 500 12px var(--font-body); color: var(--maybe); background: transparent; border: 1px solid var(--maybe); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.until { font-family: var(--font-mono); font-size: 12px; }
.tag.mine { background: var(--maybe-soft); color: var(--maybe); }
.clash { font-size: 12px; color: var(--warn); font-weight: 500; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  .slot { grid-template-columns: 1fr; }
  .slot time { position: static; padding: 4px 0 6px; }
  .ev-head { flex-direction: column; }
}
@media (prefers-reduced-motion: no-preference) { .ev { transition: opacity .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ARCHON 49</h1>
      <p>Pocket program, sortable. Gateway Center + DoubleTree, Collinsville.</p>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>

  <div class="deck" id="deck" role="region" aria-label="Filters">
    <div class="row deck-top">
      <button class="btn now" id="now" type="button">Now</button>
      <button class="btn ftoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="deckbody">Filters <span id="fsum"></span></button>
      <div class="now-msg" id="nowmsg" aria-live="polite"></div>
    </div>
    <div class="deck-body" id="deckbody">
    <div class="row">
      <div class="seg" id="days" role="group" aria-label="Day"></div>
      <div class="seg" id="views" role="group" aria-label="Show"></div>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="Search titles, people, rooms" aria-label="Search">
      <select id="cat" aria-label="Category"></select>
      <label class="chk"><input type="checkbox" id="kids"> Kids &amp; teen</label>
      <label class="chk"><input type="checkbox" id="compact"> Hide descriptions</label>
      <label class="chk" for="whomode">Panelist bios</label>
      <select id="whomode" aria-label="Panelist bios">
        <option value="open">Where I'm still deciding</option>
        <option value="always">Always</option>
        <option value="tap">Only when I tap a name</option>
      </select>
    </div>
    <div class="row" style="justify-content: space-between">
      <div class="status-line" id="sync">Picks save in this browser.</div>
      <div class="tools">
        <button class="btn" id="copy" type="button">Copy my schedule</button>
        <button class="btn" id="dl" type="button" hidden>Download printable</button>
      </div>
    </div>
    </div>
  </div>

  <details class="info">
    <summary>Hours &amp; locations</summary>
    <div class="hours" id="hours"></div>
  </details>

  <main id="list"></main>
</div>

y(M), Allison Stein, Anna Mulch, Neko Pilarcik- Tellez, Audra Angelique", "location": "Illini A - Gateway Center", "kids": false, "id": 22, "sid": "7581", "ppl": [["6319", 1], ["597", 0], ["790", 0], ["892", 0], ["6300", 0]]}, {"day": "Friday", "time": "4:00 PM", "title": "The Golden Age of Science Fiction", "category": "Author - Fan", "desc": "What classics are still legitimate classics? Are there any authors that deserve to be rediscovered?", "panelists": "Bryce Meyer(M), Kevin Randle, John Krabbe, Christopher Miskimon", "location": "Marquette B - Gateway Center", "kids": false, "id": 23, "sid": "7484", "ppl": [["3152", 1], ["6297", 0], ["6358", 0], ["6371", 0]]}, {"day": "Friday", "time": "4:00 PM", "title": "Research Rabbit Hole", "category": "Author - Craft", "desc": "Researching a story can lead down fascinating (but not always productive) tangents. Learn how to organize re-research to spark story ideas, on-the-go research to flesh out drafts and revision, and when not to include your research in the story.", "panelists": "Brad R. Cook(M), George Sirois, Kathy L. Brown, LaShaunda C. Hoffman", "location": "Marquette A - Gateway Center", "kids": false, "id": 24, "sid": "7843", "ppl": [["3137", 1], ["845", 0], ["5347", 0], ["4661", 0]]}, {"day": "Friday", "time": "4:00 PM", "title": "Autograph Session with Mark Tiedemann, Jimmy D. Gillentine, & Richard Moon", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "Mark Tiedemann, Richard H Moon, Jimmy D. Gillentine", "location": "Fishbowl - Gateway Center", "kids": false, "id": 25, "sid": "7774", "ppl": [["617", 0], ["6283", 0], ["432", 0]]}, {"day": "Friday", "time": "4:00 PM", "title": "The Wild, Chaotic Future (and Past) of Star Trek in the 2020s", "category": "Media", "desc": "Excited to see a new series starring Kirk, Bones, and Spock? Keeping your fingers crossed for Star Trek: Legacy? Just pining for something new and interesting in the Trek universe? Whether you’re mourning the death of Starfleet Academy or celebrating it, you’ll want to join us for an expansive discussion about the current status quo on the Final Frontier, and a celebration of all things Trek!", "panelists": "Luke Smith(M), Paul Hahn", "location": "Salon 4 - Gateway Center", "kids": false, "id": 26, "sid": "7837", "ppl": [["1038", 1], ["442", 0]]}, {"day": "Friday", "time": "4:00 PM", "title": "Beginner Crewel (Session 1)", "category": "General", "desc": "Crewel is an ancient art that “paints” a picture with stitched threads. In this class you will receive an introduction to some of the basic stitching techniques needed to replicate this embroidered art form. Attendees will receive supplies, choose their own colors, pick one pattern from provided options, and take their project and supplies with them when they leave. Due to small, sharp needles, please no children. NOTE – traditional crewel is completed with wool thread or yarn but we will be using cotton embroidery floss. (2 hours) (There will be two sessions to choose from, with the same information presented at each.) There is a $10 material fee (paid when supplies are handed out), but you will take home the finished product. Limited to 20 people. (Cash/Venmo/Cashapp.)", "panelists": "Jennifer Oleson", "location": "St. Clair A & B - DoubleTree", "kids": false, "id": 27, "sid": "7886", "ppl": [["4062", 0]]}, {"day": "Friday", "time": "4:30 PM", "title": "CONCERT: Eric Ray", "category": "Filk", "desc": "What do unicorns, werewolves, and pirates have in common? They’ve all wandered into Eric Ray’s songs. A familiar face in Archon filk circles, Eric steps into the spotlight for his first Archon concert this year! Come meet the creatures from your dreams.", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "id": 28, "sid": "7694", "ppl": []}, {"day": "Friday", "time": "5:00 PM", "title": "CONCERT: Magical Wanderings with Special Guest Filk GoH Tim Griffin", "category": "Filk, GOH", "desc": "Enjoy the sonic stylings of two Musical Partners In Crime. Filk GoH Tim Griffin joins the duo for three of his songs!", "panelists": "Tim Griffin", "location": "Mississippian - Gateway Center", "kids": false, "id": 29, "sid": "7697", "ppl": [["5745", 0]]}, {"day": "Friday", "time": "5:00 PM", "title": "The Many Faces of Superman", "category": "Media", "desc": "A constantly growing number of actors have played different versions of the most popular superheroes. How much does the specific actor chosen impact the role, or is it all about the writing?", "panelists": "George Sirois(M), Nick Butcher, Bryce Meyer", "location": "Salon 2 - Gateway Center", "kids": false, "id": 30, "sid": "7404", "ppl": [["845", 1], ["3722", 0], ["3152", 0]]}, {"day": "Friday", "time": "5:00 PM", "title": "Astronomy Before the Telescope", "category": "Science", "desc": "Most histories of astronomy tend to skip from the Greek development of the geocentric model (~2nd century BCE to 2nd century CE), to the Copernican revolution (mid 16th century) giving the impression that, since the predominant model did not change, no real astronomy was taking place. This talk examines why that interpretation is incorrect and explores how astronomy flourished, and why progress stagnated.", "panelists": "Jon Voisey(M)", "location": "Salon 1 - Gateway Center", "kids": false, "id": 31, "sid": "7858", "ppl": [["287", 1]]}, {"day": "Friday", "time": "5:00 PM", "title": "Art Demo with Jeremy Shipley", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "Jeremy Shipley", "location": "Salon 6 - Gateway Center", "kids": false, "id": 32, "sid": "7801", "ppl": [["4881", 0]]}, {"day": "Friday", "time": "5:00 PM", "title": "Media Literacy and Science Fiction", "category": "Fandom", "desc": "People are not being taught to think critically about the information they consume anymore. Conspiracy theories are on the rise, even with something like the moon landing and recent Artemis mission. How do we disseminate what is real and what isn't, especially in the media?", "panelists": "Jeremiah D. MacRoberts(M), Diana Morgan, Thomas Stratman, Zi Teng Wang, Allison Stein", "location": "Marquette B - Gateway Center", "kids": false, "id": 34, "sid": "7636", "ppl": [["6281", 1], ["3672", 0], ["272", 0], ["4599", 0], ["597", 0]]}, {"day": "Friday", "time": "5:00 PM", "title": "Everyone’s Using AI (So What’s Ethical Anymore?)", "category": "Author - Craft", "desc": "A Discussion for Writers Contending with this Brave New World.", "panelists": "Matt Davids(M)", "location": "Marquette A - Gateway Center", "kids": false, "id": 35, "sid": "7883", "ppl": [["1050", 1]]}, {"day": "Friday", "time": "5:00 PM", "title": "Autograph Session with John Sies, John Hornor Jacobs, & Angie Fox", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "John Sies, Angie Fox, John Hornor Jacobs", "location": "Fishbowl - Gateway Center", "kids": false, "id": 36, "sid": "7768", "ppl": [["955", 0], ["422", 0], ["770", 0]]}, {"day": "Friday", "time": "5:00 PM", "title": "The History of Dwarves", "category": "General", "desc": "Learn more about dwarves, ranging from a focused look at Tolkien’s dwarves to a broader exploration of dwarves across media.", "panelists": "Max Camero(M)", "location": "Salon 4 - Gateway Center", "kids": false, "id": 37, "sid": "7871", "ppl": [["6430", 1]]}, {"day": "Friday", "time": "5:30 PM", "title": "CONCERT: The Gateway Girls", "category": "Filk", "desc": "Take a musical tour of a twisted Saint Louis with The Gateway Girls Tour Company! They’re so excited for the Great Confluence and Summoning of Vorgax the Void Bringer, and hope to see you there!!!!!!!!!", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "id": 38, "sid": "7700", "ppl": []}, {"day": "Friday", "time": "6:00 PM", "title": "Opening Ceremonies", "category": "GOH", "desc": "", "panelists": "Joy Alyssa Day, Tim Griffin, David Mack, Larry Niven, Wyatt Weed, Fran Wilde", "location": "Lasalle - Gateway Center", "kids": false, "id": 39, "sid": "7222", "ppl": [["6319", 0], ["5745", 0], ["6320", 0], ["6347", 0], ["297", 0], ["6316", 0]]}, {"day": "Friday", "time": "6:00 PM", "title": "FRIDAY LARP: S.L.U.G.S.", "category": "Gaming", "desc": "At the end of the rail line lies Bedlam, a booming frontier town built on the promise of wealth and glory. Fortune seekers, outlaws, preachers, prospectors, and desperate souls from every corner of the frontier have flocked here, each hoping to strike it rich in the Ghost Rock mines or claim a piece of the town's prosperity. But beneath the bustle, dark spirits linger, and strange happenings haunt the dusty streets. Folks whisper that something ancient stirs below the earth, and that the greatest Ghost Rock mother lode ever discovered lies just one swing of a pickaxe away. Now, a mysterious poker game has come to town, promising untold riches to the victor. Join the St. Louis Underground Gaming Society as we journey into the Weird West of Deadlands, where every opportunity comes with a price, the law is more suggestion than rule, and the line between salvation and damnation grows thinner with each passing sunset. No one arrives in Bedlam by accident—and few ever leave unchanged. Cost: $5", "panelists": "", "location": "St. Clair A & B - DoubleTree", "kids": false, "id": 40, "sid": "7144", "ppl": []}, {"day": "Friday", "time": "7:00 PM", "title": "OUTDOOR CONCERT: Bardic Bros", "category": "Filk", "desc": "Come join the Bardic Bros out on the patio for an hour of mostly original music, including several songs never before performed at Archon! NOTE: This concert will be taking place outside in the front of the Gateway Center. In the event of bad weather, it will take place in the Mississippian room.", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "id": 41, "sid": "7705", "ppl": []}, {"day": "Friday", "time": "7:00 PM", "title": "Real Physics in Space Fantasy", "category": "Science", "desc": "Could that really happen? Discuss the physics in your favorite franchise like Star Wars and more.", "panelists": "Paul Hahn(M), Zi Teng Wang, Jack Glassman", "location": "Salon 1 - Gateway Center", "kids": false, "id": 42, "sid": "7463", "ppl": [["442", 1], ["4599", 0], ["437", 0]]}, {"day": "Friday", "time": "7:00 PM", "title": "DUNESDAY!", "category": "Media", "desc": "They're calling it \"Dunesday\": Both Dune 3 and Avengers: Doomsday arrive on December 18. Which are you more excited about, and why? Will they together break the box office, or cancel one another out?", "panelists": "Van Allen Plexico(M), Rodney Britt, Jimmy D. Gillentine, Darren Orf", "location": "Salon 6 - Gateway Center", "kids": false, "id": 43, "sid": "7422", "ppl": [["227", 1], ["1519", 0], ["432", 0], ["3494", 0]]}, {"day": "Friday", "time": "7:00 PM", "title": "Beginning Tools", "category": "Artist", "desc": "What to spend money on and what to wait on when you're just starting out as an artist and don't know for sure what you'll need or want or can afford.", "panelists": "Allison Stein(M), John Sies, Mike Cole, Audra Angelique", "location": "Illini A - Gateway Center", "kids": false, "id": 44, "sid": "7590", "ppl": [["597", 1], ["955", 0], ["377", 0], ["6300", 0]]}, {"day": "Friday", "time": "7:00 PM", "title": "Legends in Movies: Patrick Stewart and Ian McKellan", "category": "Media", "desc": "The adventures of Patrick Stewart and Ian McKellan: both play major roles in multiple sci-fi/fantasy franchises. What is it about them that make it so?", "panelists": "Nick Butcher(M), Thomas Stratman, Joseph Weihrauch", "location": "Marquette B - Gateway Center", "kids": false, "id": 45, "sid": "7410", "ppl": [["3722", 1], ["272", 0], ["6014", 0]]}, {"day": "Friday", "time": "7:00 PM", "title": "Embracing Fear", "category": "Author - Craft", "desc": "Facing the blank page, submitting work for publication, and getting dreaded rejections can trigger paralyzing fears. Learn how writers can work with fear  Stairs Screening and Q&A", "category": "Media, GOH", "desc": "After the death of his twin brother, a man goes to the family house he has just inherited to deal with his past, his own personal demons - and a ghost. Join Fan Guest of Honor Wyatt Weed and his wife Gayle Gallagher for a screening of their movie and Q&A following. Wyatt Weed and Gayle Gallagher are married filmmakers who, along with Robert Clark, make up the production company Pirate Pictures. Wyatt and Gayle have been making films in the St. Louis area for nearly 20 years. During the Covid-19 pandemic, they became frustrated that most creative projects had shut down. So in the spring of 2021, they decided to make their own feature film, by themselves and in their own house. Gayle would be the camera operator, Wyatt would act, and together they would write, direct, and produce the film. The result is Dark At The Top Of The Stairs, a micro-budget \"Covid feature\".", "panelists": "Wyatt Weed(M)", "location": "Lasalle - Gateway Center", "kids": false, "id": 50, "sid": "7832", "ppl": [["297", 1]]}, {"day": "Friday", "time": "8:00 PM", "title": "Losing Main Character Energy?", "category": "Author - Craft", "desc": "Have you ever grown bored of your main character? What can you do to make them more interesting, or is it better to kill them off?", "panelists": "Kasey Mackenzie(M), Michales Joy, Christine Amsden, Kurt Pankau, Matt Roggentine", "location": "Marquette A - Gateway Center", "kids": false, "id": 51, "sid": "7302", "ppl": [["172", 1], ["7", 0], ["2588", 0], ["5760", 0]]}, {"day": "Friday", "time": "8:00 PM", "title": "Hallway Costume Contest", "category": "", "desc": "", "panelists": "", "location": "Lobby Foyer - DoubleTree", "kids": false, "id": 52, "sid": "7225", "ppl": []}, {"day": "Friday", "time": "9:00 PM", "title": "Dance", "category": "", "desc": "", "panelists": "", "location": "Madison C & D - DoubleTree", "kids": false, "id": 53, "sid": "7203", "ppl": []}, {"day": "Friday", "time": "9:00 a", "desc": "Marvel is unique in that it has and had so many properties outside of its main cinematic universe. Some have been fantastic and some... not so much. Let's discuss them! What is their status now?", "panelists": "George Sirois(M), Van Allen Plexico, Mike Phoenix", "location": "Salon 2 - Gateway Center", "kids": false, "id": 78, "sid": "7413", "ppl": [["845", 1], ["227", 0], ["677", 0]]}, {"day": "Saturday", "time": "12:00 PM", "title": "De la Stella Fisse: The First Celestial Atlas", "category": "Science", "desc": "Despite the constellations having ancient origins and tables of stellar coordinates dating to antiquity, it wasn't until the 16th century that anyone had the bright idea to use these to plot the constellations accurately. This panel explores this first celestial atlas, entitled De la Stella Fisse, by Allesandro Piccolomini from 1540 and explores the background of its creation amidst a background of love and war. (This panel also includes a display of a 1579 copy of the book)", "panelists": "Jon Voisey(M)", "location": "Salon 1 - Gateway Center", "kids": false, "id": 79, "sid": "7862", "ppl": [["287", 1]]}, {"day": "Saturday", "time": "12:00 PM", "title": "Disclosure Day? The Truth about UFOs", "category": "Science", "desc": "What is the current state of learning the truth about UFOs? Are we any closer to the real truth?", "panelists": "Kevin Randle(M), Jack Snyder, Joe Rauscher", "location": "Salon 6 - Gateway Center", "kids": false, "id": 80, "sid": "7439", "ppl": [["6297", 1], ["252", 0], ["6390", 0]]}, {"day": "Saturday", "time": "12:00 PM", "title": "Strange Substance", "category": "Costuming", "desc": "Using found objects and unusual materials in costuming, with strategies and suggestions, and Q&A.", "panelists": "Snail Scott(M), Codi Coleman, Sandy Pettinger, Jeanna Crawford", "location": "Lasalle - Gateway Center", "kids": false, "id": 81, "sid": "7827", "ppl": [["3251", 1], ["5216", 0], ["647", 0], ["6361", 0]]}, {"day": "Saturday", "ti ), Nora Mai, Sandy Pettinger", "location": "Lasalle - Gateway Center", "kids": false, "id": 104, "sid": "7818", "ppl": [["3332", 1], ["187", 0], ["647", 0]]}, {"day": "Saturday", "time": "2:00 PM", "title": "Getting Started as a Professional Artist", "category": "Artist, GOH", "desc": "It's not enough to just make great art. A professional artist has to know how to run a business as well. We'll discuss what skills and items you'll need to make a great start as a professional artist.", "panelists": "Joy Alyssa Day(M), Sherri Dean, Neko Pilarcik-Tellez", "location": "Illini A - Gateway Center", "kids": false, "id": 105, "sid": "7577", "ppl": [["6319", 1], ["397", 0], ["892", 0]]}, {"day": "Saturday", "time": "2:00 PM", "title": "AI Is Here to Stay — So Make It Work for You", "category": "General", "desc": "The debate is over: AI is a permanent part of the creative landscape. The real question isn't whether to use it — it's how to use it without surrendering the human spark. In this hands-on panel, filmmaker Jack Snyder and creative director Doug Ferguson — game industry veteran — pull back the curtain on their real-world AI workflows. From AI-generated proof-of-concept films augmented with live actor performances to AI-assisted workflows that give your studio superpowers, they’ll share what actually works, what doesn’t, and how to make AI serve the vision — not replace it", "panelists": "Jack Snyder, Douglas Ferguson", "location": "Marquette B - Gateway Center", "kids": false, "id": 106, "sid": "7864", "ppl": [["252", 0], ["87", 0]]}, {"day": "Saturday", "time": "2:00 PM", "title": "Avoiding Scams and Grifts as a New Author", "category": "Author - Craft", "desc": "Unfortunately, there are some bad actors out there who want to capitalize off your hard work. Learn how to recognize and avoid the scammers.", "panelists": "Richard White(M), Cole Lanahan, Elizabeth Donald, Christopher Miskimon, David Benem", "location": "Marquette A - Gateway Center", "kids": false, "id": 1 eway Center", "kids": false, "id": 111, "sid": "7715", "ppl": []}, {"day": "Saturday", "time": "3:00 PM", "title": "Downsizing Your Treasures", "category": "Fandom", "desc": "You know it's not worth a lot of money, so what do you do with your life's treasures when it's time to downsize?", "panelists": "Dan Yezbick(M), Cindi Gille- Rowley, Joe Rauscher, Rich Zellich", "location": "Salon 2 - Gateway Center", "kids": false, "id": 112, "sid": "7639", "ppl": [["4704", 1], ["792", 0], ["6390", 0], ["2499", 0]]}, {"day": "Saturday", "time": "3:00 PM", "title": "A History of Constellations", "category": "Science", "desc": "The modern sky contains 88 officially recognized constellations. But many of these constellations have ancient origins. In this panel, we'll explore these origins as well as how interpretations and depictions competed and changed over time. (This panel also includes presentation of a 16th century book and other prints relevant to the discussion)", "panelists": "Jon Voisey(M)", "location": "Salon 1 - Gateway Center", "kids": false, "id": 113, "sid": "7859", "ppl": [["287", 1]]}, {"day": "Saturday", "time": "3:00 PM", "title": "Why Most Tabletop Role- Playing Books Fail", "category": "General, Gaming", "desc": "And How to Successfully Publish Yours!", "panelists": "Matt Davids(M)", "location": "Salon 6 - Gateway Center", "kids": false, "id": 114, "sid": "7882", "ppl": [["1050", 1]]}, {"day": "Saturday", "time": "3:00 PM", "title": "Beyond the UFO: Space Aliens on the Silver Screen", "category": "Media", "desc": "Creatures from outer space have been featured in movies since the beginning of movies. From A Trip to the Moon, The Day the Earth Stood Still, Alien, Independence Day, Arrival, and everything in between and beyond, how have those silver screen portrayals shaped our culture and the movies that have come after? Which alien movies have provided the foundation of our modern concept of aliens? Which alien movies do we love to hate and which don't get the d": "7765", "ppl": [["567", 0], ["537", 0], ["227", 0]]}, {"day": "Saturday", "time": "3:00 PM", "title": "Conversation with the Con Chairs & Staff Session 1", "category": "General", "desc": "Have some suggestions? Want to share a great idea? Hated everything? Want to know how to connect with those in charge? Now's your chance to share your thoughts.", "panelists": "Erin McFadden(M), Scott Corwin, Patricia McFadden", "location": "Salon 4 - Gateway Center", "kids": false, "id": 120, "sid": "7903", "ppl": [["2636", 1], ["872", 0], ["750", 0]]}, {"day": "Saturday", "time": "3:00 PM", "title": "The New Comics Canon: The Most Must-Read New Comic Books of 2025-2026", "category": "Media", "desc": "Name a genre. Name a storytelling style. In terms of pure creative freedom, there’s no medium that can hold a candle to comic books. And there’s SO MUCH good stuff hitting the stands right now — from DC’s Absolute line to the Energon Universe, from the recently reborn Vertigo to a wild kaleidoscope of indie creators. Come join us for a comic shop-style hangout where we share the stuff we’re loving right now — and let us know about the stuff you’re digging, too!", "panelists": "Luke Smith(M), Jeremy Shipley, Paul Hahn, Chris Sagovac", "location": "St. Clair A & B - DoubleTree", "kids": false, "id": 121, "sid": "7835", "ppl": [["1038", 1], ["4881", 0], ["442", 0], ["3431", 0]]}, {"day": "Saturday", "time": "3:30 PM", "title": "CONCERT: Uncle Fluffy", "category": "Filk", "desc": "It's been fifteen years since the collapse, since the global disaster that ended civilization and left the world a ruined wasteland and humanity all but extinct. But there were survivors. And those survivors had children. And those children deserve educational music that can help them survive this horrific new hellscape. And Uncle Fluffy is going to bring it to them.", "panelists": "Kurt Pankau", "location": "Mississippian - Gateway Center", "kids": false, "id": 122, "sid": "7717", "ppl": [["2588", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "So You Want To Be a Guest...", "category": "Fandom", "desc": "How do conventions choose their guests? What is expected of them? What's the difference between a guest and a Guest of Honor?", "panelists": "Les Haven(M), Erin McFadden, Patricia McFadden, George Sirois, Alan DeVaughan", "location": "Salon 2 - Gateway Center", "kids": false, "id": 123, "sid": "7621", "ppl": [["132", 1], ["2636", 0], ["750", 0], ["845", 0], ["870", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Space Mining: Back to the Moon", "category": "Science", "desc": "Including mining the cometary volatiles trapped in the lunar cryogenic polar craters. What else could we mine for resources for space colonists?", "panelists": "Bob Perry(M), Bryce Meyer, Richard H Moon, Christine Nobbe", "location": "Salon 1 - Gateway Center", "kids": false, "id": 124, "sid": "7455", "ppl": [["547", 1], ["3152", 0], ["6283", 0], ["537", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Filmmaking in the Age of AI", "category": "Media", "desc": "Filmmaker Jack Snyder shares what he’s learned using AI in real-world film projects and how these tools can help small teams move faster, think bigger, and expand what’s possible on limited resources. Snyder will also screen his award-winning sci-fi AI short film ANOMALY and discuss how he blends traditional filmmaking with AI. He’ll discuss where the technology proved useful, where it fell short, and why AI, used the right way, can keep creativity in the hands of humans while creating new opportunities and new creative jobs instead of simply eliminating them. (2 hours)", "panelists": "Jack Snyder(M)", "location": "Salon 6 - Gateway Center", "kids": false, "id": 125, "sid": "7867", "ppl": [["252", 1]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Battling Imposter Syndrome", "category": "Artist, GOH", "desc": "Just about every creative professional has had sometimes debilitating bouts of \"Imposter Syndrome\". Hear what can you do if you start doubting yourself and listening to those darned little voices.", "panelists": "Jamie Madigan, Douglas Ferguson, Sherri Dean(M), Jeanna Crawford, Joy Alyssa Day", "location": "Illini A - Gateway Center", "kids": false, "id": 126, "sid": "7580", "ppl": [["397", 1], ["6285", 0], ["87", 0], ["6361", 0], ["6319", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Balloon Animal Sculpting", "category": "General", "desc": "Come one, come all! Learn about balloon sculpting and how to make a balloon dog (and other ideas as time permits).", "panelists": "John Wardale", "location": "Marquette B - Gateway Center", "kids": false, "id": 127, "sid": "7911", "ppl": [["5861", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Finish Your Book: A How-To", "category": "Author - Craft", "desc": "Getting through that last step without turning to drink.", "panelists": "Marella Sands(M), Joey Froehlich, Zo Allen, Angie Fox, Cole Lanahan", "location": "Marquette A - Gateway Center", "kids": false, "id": 128, "sid": "7323", "ppl": [["567", 1], ["650", 0], ["422", 0], ["97", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Autograph Session with R.J. Carter & Jeremiah D. MacRoberts", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "R.J. Carter, Jeremiah D. MacRoberts", "location": "Fishbowl - Gateway Center", "kids": false, "id": 129, "sid": "7780", "ppl": [["47", 0], ["6281", 0]]}, {"day": "Saturday", "time": "4:00 PM", "title": "How to Be a Filmmaker: The Work of Wyatt Weed", "category": "Media, GOH", "desc": "Join Fan Guest of Honor Wyatt Weed as he talks about his projects and long career.", "panelists": "Wyatt Weed(M)", "location": "Salon 4 - Gateway Center", "kids": false, "id": 130, "sid": "7913", "ppl": [["297", 1]]}, {"day": "Saturday", "time": "4:00 PM", "title": "Beginner Crewel (Session 2)", "category": "General", "desc": "Crewel is an ancient art that “paints” a picture with stitched threads. In this class you wi ome see a close up magic show!", "panelists": "Zi Teng Wang", "location": "Salon 2 - Gateway Center", "kids": false, "id": 135, "sid": "7504", "ppl": [["4599", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "O’Neill Cylinder Space Settlements", "category": "Science", "desc": "A discussion about Gerard K. O'Neill's theoretical space settlements: proposed large space habitats rotating for artificial gravity built from resources exported from the Moon, including O'Neill's trick for Space Megastructures to turn to face the Sun during their year without using rockets.", "panelists": "Richard H Moon, Bob Perry, Bryce Meyer(M), Joe Rauscher", "location": "Salon 1 - Gateway Center", "kids": false, "id": 136, "sid": "7457", "ppl": [["3152", 1], ["6283", 0], ["547", 0], ["6390", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "Whispers from the Static: Analog Technology as a Source of Horror", "category": "General", "desc": "How do outdated technologies—landline phones, VHS tapes, radio static, and rotary dials—evoke unease in today’s digital world? This panel examines the eerie alienation of analog devices and their growing role as unsettling motifs in horror fiction and film.", "panelists": "Darren Orf, Jeanna Crawford, John Hornor Jacobs(M), Jimmy D. Gillentine", "location": "Illini A - Gateway Center", "kids": false, "id": 137, "sid": "7518", "ppl": [["770", 1], ["3494", 0], ["6361", 0], ["432", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "The Future of Table Top Gaming", "category": "General, Gaming", "desc": "Will it slowly go out of style, or is the in person aspect strong enough to maintain it's popularity? Is there still any money to be made for creators?", "panelists": "Nick Butcher(M), Jamie Madigan, Michales Joy, Douglas Ferguson", "location": "Marquette B - Gateway Center", "kids": false, "id": 138, "sid": "7543", "ppl": [["3722", 1], ["6285", 0], ["87", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "Writing While Neurodivergent", "category": "Author - Craft", "desc": "Writing and creating while neurodivergent can be challenging. How do you overcome roadblocks? How do you deal with challenges like hyperfocus and task paralysis? How do you balance the challenges of everyday life with your creative journey? Join a panel of neurodivergent writers and creators to discuss how they approach creative pursuits and get tips and tools to help you on your journey.", "panelists": "Diana Morgan(M), Kasey Mackenzie, Sela Carsen, Debbie Manber Kupfer, Jeremiah D. MacRoberts", "location": "Marquette A - Gateway Center", "kids": false, "id": 139, "sid": "7359", "ppl": [["3672", 1], ["172", 0], ["815", 0], ["6281", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "Author Reading and Autograph Session with Toastmaster David Mack", "category": "Reading / Signing / Art Demo, GOH", "desc": "", "panelists": "David Mack", "location": "Fishbowl - Gateway Center", "kids": false, "id": 140, "sid": "7739", "ppl": [["6320", 0]]}, {"day": "Saturday", "time": "5:00 PM", "title": "Starting a Podcast and Guesting on One", "category": "General", "desc": "Hear our experts discuss the do's and don'ts, podcast etiquette, and how to get off the ground and running!", "panelists": "George Sirois(M), Van Allen Plexico, Audra Angelique", "location": "Salon 4 - Gateway Center", "kids": false, "id": 141, "sid": "7555", "ppl": [["845", 1], ["227", 0], ["6300", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "Be the Player Every GM Wants at the Table", "category": "General, Gaming", "desc": "Upping Our Role-Playing Skills.", "panelists": "Matt Davids(M)", "location": "Salon 6 - Gateway Center", "kids": false, "id": 142, "sid": "7880", "ppl": [["1050", 1]]}, {"day": "Saturday", "time": "6:00 PM", "title": "That Was Better", "category": "General", "desc": "Egads! The TV show was better than the source material!", "panelists": "Darren Orf(M), Heather Hinson, Matthew Edward Munro", "location": "Illini A - Gateway Center", "kids": false, "id": 143, "sid": "7537", "ppl": [["3494", 1], ["3294", 0], ["740", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "The Business of Writing", "category": "Author - Craft", "desc": "Tips and advice on learning how to deal with publishers, editors, and the whole shebang.", "panelists": "Angie Fox, Cole Lanahan, Kevin Randle, Debbie Manber Kupfer(M), Joey Froehlich", "location": "Marquette B - Gateway Center", "kids": false, "id": 144, "sid": "7251", "ppl": [["422", 0], ["97", 0], ["6297", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "Steal This Panel", "category": "Author - Craft, GOH", "desc": "What makes a heist great, and how to make it believable for your readers.", "panelists": "Van Allen Plexico(M), Fran Wilde, David Von Allmen, Kasey Mackenzie, David Mack", "location": "Marquette A - Gateway Center", "kids": false, "id": 145, "sid": "7326", "ppl": [["227", 1], ["6316", 0], ["695", 0], ["172", 0], ["6320", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "Author Reading with Mark Tiedemann, Zi Teng Wang, & Ray Tabler", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "Mark Tiedemann, Ray Tabler, Zi Teng Wang", "location": "Fishbowl - Gateway Center", "kids": false, "id": 146, "sid": "7745", "ppl": [["617", 0], ["4405", 0], ["4599", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "Developing an Audio Drama", "category": "General", "desc": "While not as popular as in radio's heyday, audio dramas are experiencing a resurgence. Come learn how to start creating your own from your ideas.", "panelists": "Jack Snyder(M), George Sirois, Jeremiah D. MacRoberts, Audra Angelique", "location": "Salon 4 - Gateway Center", "kids": false, "id": 147, "sid": "7558", "ppl": [["252", 1], ["845", 0], ["6281", 0], ["6300", 0]]}, {"day": "Saturday", "time": "6:00 PM", "title": "Saturday LARP", "category": "Gaming", "desc": "St. Louis, early 1990s, in an alternate universe. The Continental is one of the hottest clubs in the Central West End, drawing musicians, hustlers, hip suburbanites, scene regulars, fixers, and supernatural troublemakers from across the metro area. Tonight starts like any other crowded night: music, drinking, flirting, grudges, business, and people who probably should not be in the same room together. Adding to the usual noise is a rumor that the club owner, Michael Jones, is looking to sell out. As the night unfolds, favors change hands, alliances shift, old problems resurface, and everyone begins to realize The Continental may be worth more than anyone bargained for. A 25–30 player, rules-light St. Louis fantasy LARP inspired by Mage: The Ascension, focused on nightlife, social maneuvering, faction politics, betrayal, and supernatural intrigue. No prior knowledge of Mage is required...or expected.", "panelists": "", "location": "St. Clair A & B - DoubleTree", "kids": false, "id": 148, "sid": "7145", "ppl": []}, {"day": "Saturday", "time": "7:00 PM", "title": "Defying Gravity: Wicked Parts 1 & 2", "category": "Media", "desc": "A discussion of impressions of the movie, comparisons between the movie and the stage show, and if full production movies are better than an on stage recording of the production such as Hamilton.", "panelists": "Paul Hahn(M), Joseph Weihrauch, Jimmy D. Gillentine, John Krabbe", "location": "Salon 6 - Gateway Center", "kids": false, "id": 149, "sid": "7390", "ppl": [["442", 1], ["6014", 0], ["432", 0], ["6358", 0]]}, {"day": "Saturday", "time": "7:00 PM", "title": "World Building 101", "category": "Author - Craft", "desc": "Whether you're a writer or a gamer, the world where your adventure is taking place deserves to be fleshed out. The panelists will give tips on how to create a world from scratch, how much is too much world building, and how to make it believable no matter how fantastic it is.", "panelists": "Richard White(M), Richard H Moon, Mark Tiedemann, Michales Joy, Sela Carsen", "location": "Marquette A - Gateway Center", "kids": false, "id": ft", "desc": "The definition seems simple: in narrative fiction, the plot is what happens, the theme is what the story is all about, and the subtext is what the characters think about it all but don’t say openly. But how do these three crucial elements of storytelling work together? Are motifs part of the theme, the subtext, or something wholly separate? Our panel of veteran scribes will discuss all this and more.", "panelists": "Kurt Pankau(M), Christine Amsden, David Von Allmen, Ray Tabler, ", "location": "Illini A - Gateway Center", "kids": false, "id": 158, "sid": "7317", "ppl": [["2588", 1], ["7", 0], ["695", 0], ["4405", 0]]}, {"day": "Sunday", "time": "10:00 AM", "title": "The Life and Works of Isaac Asimov", "category": "Author - Fan", "desc": "Discuss one of the most famous science fiction writers whose work is still woven throughout popular culture.", "panelists": "Jack Glassman(M), Alan DeVaughan, Bryce Meyer, Mark Tiedemann", "location": "Marquette B - Gateway Center", "kids": false, "id": 159, "sid": "7500", "ppl": [["437", 1], ["870", 0], ["3152", 0], ["617", 0]]}, {"day": "Sunday", "time": "10:00 AM", "title": "How People Speak: Using Phonetic Dialog in Your Work", "category": "Author - Craft", "desc": "Intentionally using phonetic dialog can immerse the reader further into your setting or character, and make the experience more interesting. However, this can cross the line into stereotypes and bigotry. How do you stay on the right side of the line?", "panelists": "Shawntelle Madison, John Krabbe(M), Sela Carsen, R.J. Carter, Brian Katcher", "location": "Marquette A - Gateway Center", "kids": false, "id": 160, "sid": "7250", "ppl": [["6358", 1], ["177", 0], ["815", 0], ["47", 0], ["692", 0]]}, {"day": "Sunday", "time": "10:00 AM", "title": "Author Reading with Richard C. White & Kevin Randle", "category": "Reading / Signing / Art Demo", "desc": "", "panelists": "Richard White, Kevin Randle", "location": "Fishbowl - Gateway Center", "kids": false, "id" h(M), Wyatt Weed, Patrick Jones", "location": "Salon 6 - Gateway Center", "kids": false, "id": 166, "sid": "7417", "ppl": [["1038", 1], ["297", 0], ["1144", 0]]}, {"day": "Sunday", "time": "11:00 AM", "title": "Unison! Idol Fest", "category": "", "desc": "The Unison! Idol Fest is Archon's premiere stage for Midwestern idols and dance groups alike! Love of performance and music drives the core of the festival: our dancers! Show up and show out for our fantastic cast of all-around super stars and cheer them on as they take the stage! Longtime mainstays of Japanese cultural festivals and anime conventions, Archon is pleased to present our third Idol Fest!", "panelists": "", "location": "Lasalle - Gateway Center", "kids": false, "id": 167, "sid": "7245", "ppl": []}, {"day": "Sunday", "time": "11:00 AM", "title": "Mason & Dixon and Gravity: How Two Surveyors Mapped the American Frontier and Wound Up Weighing the Earth", "category": "Science", "desc": "In 1763, Charles Mason and Jeremiah Dixon began a survey of the region of North America around the Pennsylvania border. Although intended as a solution to a land-ownership dispute, their work wound up as a component of the conflicts, a century later, that resulted in the American Civil War. But an additional, unexpected consequence of their work was the first experimental measurement of the mass of the Earth! This took place thirty years before rigorous experiments were conducted on the topic. In this presentation, I will discuss how the remarkable precision of 18th century surveying and the scientific rigor of two surveyors led to this often-overlooked discovery.", "panelists": "Jack Glassman(M)", "location": "Illini A - Gateway Center", "kids": false, "id": 168, "sid": "7920", "ppl": [["437", 1]]}, {"day": "Sunday", "time": "11:00 AM", "title": "Non-Denominational Worship Service", "category": "General", "desc": "", "panelists": "", "location": "Marquette B - Gateway Center", "kids": false, "id": 169, "sid": "7249", "ppl" Children's Programming, Teen", "desc": "Come learn to play King of Tokyo. Control giant monsters and robots to battle and take over the city!", "panelists": "", "location": "Salon 5 - Gateway Center", "kids": true, "id": 213, "sid": "7675", "ppl": []}, {"day": "Sunday", "time": "10:00 AM", "title": "Sock Puppets!", "category": "Children's Programming", "desc": "Come make your own sock puppet!", "panelists": "", "location": "Salon 5 - Gateway Center", "kids": true, "id": 214, "sid": "7676", "ppl": []}, {"day": "Sunday", "time": "11:00 AM", "title": "Storytime with Jessica", "category": "Children's Programming", "desc": "Listen to stories with Jessica Mathews. Jessica Mathews", "panelists": "", "location": "Salon 5 - Gateway Center", "kids": true, "id": 215, "sid": "7678", "ppl": [["3427", 0]]}, {"day": "Sunday", "time": "12:00 PM", "title": "Honey I Shrunk the Art!", "category": "Children's Programming", "desc": "Come make shrinky dinks!", "panelists": "", "location": "Salon 5 - Gateway Center", "kids": true, "id": 216, "sid": "7681", "ppl": []}, {"day": "Sunday", "time": "1:00 PM", "title": "Gaming Hour", "category": "Children's Programming", "desc": "Come play games from Children's Programming library or bring your own to enjoy!", "panelists": "", "location": "Salon 5 - Gateway Center", "kids": true, "id": 217, "sid": "7682", "ppl": []}, {"day": "Friday", "time": "9:00 PM", "end": "11:30 PM", "title": "Red Light Room Karaoke", "category": "Party", "desc": "Karaoke lounge in the DoubleTree party room area.", "panelists": "", "location": "Room 162 - DoubleTree", "kids": false, "sid": null, "ppl": [["1038", 0]], "extra": "Hosts: Luke Smith and Steve Atteberry", "custom": true}, {"day": "Saturday", "time": "9:00 PM", "end": "11:30 PM", "title": "Red Light Room Karaoke", "category": "Party", "desc": "Karaoke lounge in the DoubleTree party room area.", "panelists": "", "location": "Room 162 - DoubleTree", "kids": false, "sid": null, "ppl": [["1038", 0]], "extra": "Hosts: Luke Smith and Steve Atteberry", "custom": true}, {"day": "Saturday", "time": "11:00 AM", "end": "12:30 PM", "title": "Ars Arcanum Load In / Setup", "category": "Band", "desc": "Setup for the 1:00 PM outdoor concert.", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "sid": null, "ppl": [], "extra": "", "custom": true}, {"day": "Saturday", "time": "12:30 PM", "end": "1:00 PM", "title": "Ars Arcanum Soundcheck", "category": "Band", "desc": "Soundcheck before the 1:00 PM outdoor concert.", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "sid": null, "ppl": [], "extra": "", "custom": true}, {"day": "Saturday", "time": "2:00 PM", "end": "3:00 PM", "title": "Ars Arcanum Load Out", "category": "Band", "desc": "Teardown after the outdoor concert.", "panelists": "", "location": "Mississippian - Gateway Center", "kids": false, "sid": null, "ppl": [], "extra": "", "custom": true}]</script>
<script type="application/json" id="people">{"1001": {"n": "Jan Gephardt Sherrell", "s": "Kansas City SF novelist and fantasy artist; XK9 books about uplifted police dogs. Paper sculpture in the Art Show.", "b": "Jan S. Gephardt (pronouns: she/her) is a science fiction novelist, fantasy artist, publisher, and sf/f fan from Kansas City. Co-founder and Art Director of Weird Sisters Publishing, her “XK9” books feature a pack of uplifted police dogs in a far-future world. (the dog does not die). She recently finished and published “The Complete XK9 ‘Bones’ Trilogy Omnibus Edition,” and “The XK9 ‘Bones’ Trilogy Companion.” She’s also a former officer and current member of ASFA. Look for her nationally-recognized paper sculpture in the Art Show."}, "1038": {"n": "Luke Smith", "s": "Singer/songwriter of local folk metal band Ars Arcanum; D&D, Marvel, Star Trek and pro wrestling fan.", "b": "The lead singer/songwriter for local folk metal band ARS ARCANUM, Luke has been coming to Archon since its 41st installment. He’s happy to talk your ear off about Dungeons & Dragons, Marvel Comics, Star Trek, or professional wrestling. He’s also the co-host of the yearly Red Light Room karaoke lounge, held in the Doubletree Hotel’s party room area."}, "1050": {"n": "Matt Davids", "s": "Tabletop RPG writer (The Book of Random Tables), novelist (The Spaceport Gambit), podcaster, ex-filmmaker.", "b": "Matt Davids is a writer, creator of tabletop role-playing game resource books, novelist, podcast host, and former filmmaker. He is the author of the Amazon bestsellers The Book of Random Tables and The Book of Random Tables: Quests. His first novel, The Spaceport Gambit, was released in June 2021. He lives in Missouri with his wife and their four children. His bookshelves groan under the weight of classic literature, science fiction, and fantasy. He enjoys playing Dungeons & Dragons, studying cinema and philosophy, and knows more about ’80s post-apocalyptic movies than any reasonable person should."}, "1144": {"n": "Patrick Jones", "s": "", "b": ""}, "1301": {"n": "Lindsey Wolfford", "s": "", "b": ""}, "132": {"n": "Les Haven", "s": "", "b": ""}, "1322": {"n": "Tony Mast", "s": "Host of the Back Seat Producers movie podcast; founded the Sausagefest breast cancer fundraiser at Archon.", "b": ""}, "1519": {"n": "Rodney Britt", "s": "", "b": ""}, "172": {"n": "Kasey Mackenzie", "s": "St. Louis author of fantasy, romance, SF, mystery and YA.", "b": "Kasey Mackenzie lives with her husband and son in St. Louis, Missouri; home of the Gateway Arch, the baseball Cardinals, and the world’s greatest thin-crust pizza. Kasey was one of those students who always had her nose in a book–so no big surprise when she was voted “Teacher’s Pet” in her high school yearbook. Today, she is a voracious reader and writer of fantasy, romance, science fiction, mystery, and YA. She adores her mischievous cat and shaking her groove thing as a Zumba instructor."}, "177": {"n": "Shawntelle Madison", "s": "USA Today bestselling author; Coveted urban fantasy series and the acclaimed historical novel The Fallen Fruit.", "b": "USA Today bestselling author Shawntelle Madison has written over 15 science fiction, fantasy, and romance titles, most notably the urban fantasy series Coveted. She earned her undergraduate degree in Math from Iowa State University and her MFA in Writing from Lindenwood University. Originally from Iowa, she currently lives in Missouri with her family, where she works as a developer while writing more novels. Her debut historical fiction book, The Fallen Fruit, was an instant USA Today bestseller and has received critical acclaim, including being named one of Christian Science Monitor's Best Books of 2024, an LA Times' Most Anticipated Fall 2024 Book, an Essence Magazine's Top 20 Fall 2024 Read, and a Washington Post Noteworthy Book for September 2024. Her next book, The Midnight Bus, is coming out in summer 2027 from Penguin Random House."}, "182": {"n": "Bruce Mai", "s": "President of the St. Louis Costumers Guild and costuming historian; built a Dalek 40 years ago.", "b": "Bruce’s entry into fandom was building a Dalek 40 years ago – it’s still In his basement.   Learning to sew from fellow fan and wife Nora, they became immersed in convention costuming fandom.  He is the current president of the St. Louis Costumers Guild.  Both serve as archivists for the International Costumers’ Guild (ICG), preserving the history and imagery of fan costuming. He primarily focuses on writing articles for the Fancyclopedia website and creating video presentations for conventions and the ICGArchives YouTube Channel.   They received the ICG Lifetime Achievement Award in 2010 for their service to the costuming community."}, "187": {"n": "Nora Mai", "s": "Costumer for five decades, former International Costumers' Guild president, mostly original SF/F designs.", "b": "Nora Mai was President of the ICG for 3 years, chaired Costume-Con 16 & has edited 5 Future Fashion Folios. She was the founding President of the St. Louis Costumers Guild & has held SLCG offices on and off for over 30 years.   A frequent contributor to the Future Fashion Folios, she started making her own Middle Eastern Dance costumes in High School because she couldn’t afford to buy them.  She has been costuming for over five decades with experience in Historical and SF & F, and mostly creates original designs. She & Bruce received the ICG Lifetime Achievement Award in 2010. At Costume-Con 30 Nora received the Founders Award for service to Costume-Con. Recently she began collecting and costuming BJDs.  And she currently works as the primary photo archivist (digitizing & inventorying) for the Pat & Peggy Kennedy Memorial Library and the International Costumers Gallery."}, "227": {"n": "Van Allen Plexico", "s": "Pulp and space opera author of 26 novels (superheroes, kaiju); Babylon 5 podcast co-host.", "b": "Van Allen Plexico is a five-time Best Novel award-winner, a member of the SFWA, and a Grand Master of Pulp Fiction. Author of 26 novels and counting, on subjects ranging from space opera to superheroes to Kaiju, he is a regular columnist for Black Gate Sword & Sorcery Magazine. He also co-hosts the \"White Rocket Babylon 5 and Sci Fi Review Podcast.\""}, "2295": {"n": "Kathy Bailey", "s": "Writes romance, poetry, SF and \"women's kaiju\"; former newspaper reporter.", "b": "Kathy Bailey (she/her) writes romance, poetry, science fiction, and women's kaiju. Her novel Half Dome, Whole Heart is available on Amazon. Her short works have appeared in the Flame Tree Fiction Newsletter, Dreams & Nightmares, and Utopia Science Fiction. Before focusing on fiction she was a newspaper reporter at the Oakland Tribune and San Francisco Examiner. She currently lives in the American Midwest with three kids, two dogs, and one husband."}, "2495": {"n": "John Radke", "s": "", "b": ""}, "2499": {"n": "Rich Zellich", "s": "Longtime St. Louis fan, past Archon chair, art collector, Old West shooting hobbyist.", "b": "The old one is still good; here 'tis again if you don't have a copy in your files (I just changed \"for over 45 years\" to \"since late 1979\" so it never has to be updated for longevity): A science fiction fan since he discovered the school library in the fifth grade, Rich Zellich has been active in St. Louis area fandom since late 1979, much of that time being involved as an officer of the St. Louis Science Fiction Society and a committee member (and occasional chairman) of the Archon Science Fiction and Fantasy convention. He is an avid reader and art collector. He and his late wife, the lovely and talented Michelle Zellich, also promoted two failed St. Louis Worldcon bids and a successful NASFiC bid. Now retired from programming computers for the US military, Rich can be found on occasional Sundays in alternate history Old West costume, shooting six-guns, Winchesters, and sawed-off shotguns at steel \"bad guys\", and is also an accomplished armchair model railroader."}, "252": {"n": "Jack Snyder", "s": "Screenwriter/director; wrote 57 Seconds (Morgan Freeman sci-fi thriller) and Lifetime thrillers.", "b": "Jack Snyder is an award-winning screenwriter and director whose films have been distributed by 20th Century Fox, NBCUniversal, Warner Bros., and Sony. His work has screened theatrically and aired on Showtime, Syfy, Lifetime, and across major streaming platforms. His latest film, 57 SECONDS—a sci-fi thriller starring Morgan Freeman and Josh Hutcherson—was released theatrically and digitally in 2023. Jack served as script consultant and co-producer, and also penned the novel adaptation. For Lifetime Movie Network, Jack wrote and directed the suspenseful FAMILY OF LIES, now streaming on Tubi and available on Blu-ray/DVD via Sony Pictures. Jack’s indie film credits include the atmospheric horror COLD MOON (co-writer, co-producer), starring Josh Stewart and Christopher Lloyd, the true war drama WALKING WITH THE ENEMY, for which he wrote Ben Kingsley’s scenes, and the quirky crime comedy BAD GRANDMAS (co-writer), featuring Florence Henderson, Pam Grier, and Judge Reinhold. He also wrote, directed, and produced two original thrillers: FATAL CALL (Warner Bros. VOD), starring Jason London, Danielle Harris, and Kevin Sorbo, and GHOST IMAGE (Showtime/20th Century Fox), starring Elisabeth Röhm and Stacey Dash. Jack is currently a staff writer on the YouTube sci-fi/horror series Black Veil. He also has multiple feature film projects in various stages of development. He is a Full Member of the Science Fiction and Fantasy Writers Association (SFWA) and an Active Member of the Horror Writers Association (HWA). When Jack is not writing, producing, or directing, he and his family split their time between their hometown of St. Louis and the many beaches of Los Angeles."}, "2588": {"n": "Kurt Pankau", "s": "St. Louis author and musician; short SF in Nature and Escape Pod, novel High Noon on Phobos. Loves time travel stories.", "b": "Kurt Pankau is a technologist, author, and musician in St. Louis. He has a weakness for board games, dad-jokes, and stories about time travel. His fiction has appeared in various and sundry places around the web, including Nature Magazine, Escape Pod, and Daily Science Fiction. He is the author of HIGH NOON ON PHOBOS, the co-author with Kathy Bailey of BRIDEZILLA, and the creator of UNCLE-FLUFFY'S POST-APOCALYPTIC SING-ALONG."}, "2636": {"n": "Erin McFadden", "s": "Archon co-chair who runs programming; elementary teacher, Batman and Futurama fan.", "b": "Erin's first Archon was Archon 7 in 1983, at the age of 2 months old!  Erin, along with her twin sister, Patricia, has been running Archon Programming since Archon 39.  Archon 45 will be her 26th consecutive Archon!  Her late father, Michael McFadden, attended Archons 1 through 41, was Toastmaster of Archon 26, and won an Archon Hall of Fame award.  Erin is an elementary school teacher, an avid cook, and a fan of comics (especially Batman), Legos, and Futurama.  Erin lives in St. Charles with her husband Matt and their fat dog and angry cat."}, "272": {"n": "Thomas Stratman", "s": "Supernatural horror writer, poet and artist; former chaplain.", "b": "Author, poet, editor, artist, chaplain. I worked in Loss Prevention and Human Resources to pay my bills while performing chaplaincy service, mostly for the homeless, incarcerated, or hospitalized. I am now semi-retired due to physical disability. I write (because I have a deep, gut level need to write) Supernatural Horror.  My stories always deal with horrors that could never appear in the news.  If you want axe murderers with psychological problems scroll through the news.  If you want a glimpse at that which cannot be grasped, an excursion down the unnamable avenues of a reality we suspect may exist (but hope does not), then my tales just might fit your palate. I enjoy role-playing games, photography (black and white/Infrared), researching in big, old libraries and confusing my cats. I was born (although some suspect it was not birth) in the St. Louis Missouri hospital where the actual Exorcism (of book and movie fame) took place.  The floor (where said exorcism took place, not where I was born) remained sealed and unused until the building was torn down to make room for a grocery store (you can't make this kind of stuff up)."}, "287": {"n": "Jon Voisey", "s": "Known as Jon Chesey in the SCA (medieval recreation). Astronomy grad researching pre-telescope astronomy (Ptolemy's Almagest).", "b": "Jon Voisey graduated from the University of Kansas in 2008 with a Bachelors of Science in Astronomy. Since then, he has worked as a teacher, an estate jewelry specialist, and data analyst. As a hobby, he participates in medieval recreation with the Society for Creative Anachronism (SCA). His interest in astronomy and history led him to begin researching the history of astronomy prior to the invention of the telescope. This has primarily involved working through Ptolemy's 2nd century Almagest to understand how the Greek geocentric model (which dominated medieval astronomy) was derived and functioned. His work is presented in his blog (which focuses on his work on the Almagest ) and his YouTube channel."}, "297": {"n": "Wyatt Weed", "s": "Fan Guest of Honor. Filmmaker and VFX/creature-suit veteran: Star Trek: Voyager, Muppets from Space, The Guyver.", "b": "Wyatt Weed is an actor, FX technician, and filmmaker from Springfield, Illinois. He spent 20 years in Los Angeles working as a “Jack of All Trades” before returning to the St. Louis area and joining Pirate Pictures. Wyatt's visual effects credits include FLIGHT OF THE INTRUDER, STAR TREK: VOYAGER, NECRONOMICON, SPECES, DARK SHADOWS, TALES FROM THE CRYPT, LORD OF ILLUSIONS, JAY-JAY THE JET PLANE, MUPPETS FROM SPACE, MISSION: IMPOSSIBLE 2, and RED PLANET. He has worked as a model maker, sculptor, prop maker, puppeteer, actor, and creature suit performer. Wyatt soon moved into second unit directing and visual effect supervision on the features KUNG FU RASCALS, THE GUYVER, GUYVER: DARK HERO, GUARDIAN OF THE REALM, and DRIVE. He also directed STAR RUNNERS, a science fiction television pilot, and the feature films SHADOWLAND and FOUR COLOR EULOGY. His acting credits include STAR TREK: THE NEXT GENERATION (The High Ground) and as the Boar Predator in the film PREDATOR 2. He was cast in the upcoming THE BATON ROUGE SERIAL KILLER and has a role in the upcoming horror film REAPER ROAD. In 2016 Wyatt completed work on THE DARK KNIGHT RETURNS, a Batman fan film that has been a passion project for 30 years. In 2020 he was cast as Nick Fury in SPIDER-MAN: MONSTERS OF MANHATTAN, a feature-length fan film now in post production. Wyatt continues to work in film production in the St. Louis area. In 2024 he and his wife Gayle completed the feature film project DARK AT THE TOP OF THE STAIRS, which they filmed during the Covid shutdown."}, "302": {"n": "Richard White", "s": "Multi-genre and tie-in author (Star Trek, Doctor Who, Battletech); Golden Age comics homage Cry Havoc; worldbuilding guide.", "b": "Richard C. White is multi-genre author. His latest novella collection, Cry Havoc: The Furies Book One, an action/adventure homage to the Golden Age of Comics, will be released in March 2026. Other works include On Wings of Steel, Chasing Danger: The Case Files of Theron Chase, Harbinger of Darkness, For a Few Gold Pieces More, and Terra Incognito, a non-fiction book on world building. He’s appeared in Origins Game Fair anthologies (Monsters, Robots, and Space), as well as in pulp anthologies such as Thrilling Adventure Yarns 2021, Liberty Girl: Fight for Freedom, All for One: Tales of the Musketeers, The New Adventures of Rocky Jordan, and Charles Boeckman Presents: Johnny Nickle.. As a media tie-in writer, he’s written for Star Trek, Doctor Who, Battletech, and The Incredible Hulk franchises. His novel, Gauntlet Dark Legacy: Paths of Evil, was a best-selling tie-in for his publisher. His latest tie-in works are One Night in Freeport and Storm Wreck for Nisaba Press (Green Ronin Gaming). Richard is a member of the Science Fiction and Fantasy Writers Association and the International Association of Media Tie-in Writers. Additionally, Richard serves on the SFWA Writer Beware committee."}, "3137": {"n": "Brad R. Cook", "s": "St. Louis steampunk author of the Iron Chronicles novels; past president and now historian of the St. Louis Writers Guild.", "b": ""}, "3152": {"n": "Bryce Meyer", "s": "Engineer working in aerospace, AI and space agriculture; wrote the textbook Designing Farms in Space.", "b": "Bryce L. Meyer is an engineer and technologist of many types, with degrees in engineering and biology, and professional experience in aerospace engineering, artificial intelligence, and space agriculture. He has a textbook, Designing Farms in Space, and works as Research Director of AI and Cyber at Franciscan University of Steubenville."}, "3251": {"n": "Snail Scott", "s": "Surrealist sculptor in ceramics and metal; taught art at UMSL.", "b": "Snail Scott has been a sculptor since childhood, when she annoyed fellow kindergarteners by carving their crayons into tiny artworks. She eventually earned degrees in both art and architecture, and taught for many years at the University of Missouri-St. Louis.  Her surrealist sculpture in ceramics and metals explores transitional states of being, using imagery from engineering and the natural world, with influences ranging from history to science fiction.  She maintains a studio near St. Louis, MO, lives underground, and herds cats."}, "3294": {"n": "Heather Hinson", "s": "Freelance editor and book PR; co-director of 221B Con (Sherlock Holmes).", "b": "I started out as a blogger & reviewer for small press/self published books and have expanded to a freelance editor & PR developer. I am the new co-director of 221B Con, a Sherlock Holmes convention located in Atlanta. I am also on staff with Anime STL and Holmes in the Heartland, hosted every other year, coming back in 2026. In my spare time (ha!) I am a fan girl and an author."}, "3332": {"n": "Susan Bien", "s": "", "b": ""}, "3427": {"n": "Jessica Mathews", "s": "Self-published paranormal fiction for adults and kids.", "b": "Jessica Mathews writes and self-publishes paranormal fiction for adults and children. She wants her books to inspire others to follow their passions as much as her favorite books inspired her when she was growing up."}, "3431": {"n": "Chris Sagovac", "s": "", "b": ""}, "3494": {"n": "Darren Orf", "s": "Likely: science and tech writer and editor (Popular Mechanics, Gizmodo).", "b": ""}, "3672": {"n": "Diana Morgan", "s": "St. Louis indie SF/F author: Alliances (Lost Colony) space adventure. Centers strong women, found family and neurodivergent characters. Former librarian; offers critique and sensitivity reading.", "b": "Diana Morgan writes science fiction and fantasy featuring strong women, found family, and fantastic worlds. She grew up in small-town Missouri watching Quantum Leap, Power Rangers, and Star Wars. When she’s not writing, she’s catching up on her favorite TV shows, reading comics, and sharing her love of all things geeky online. Follow her at dianamorganauthor.com or patreon.com/DianaMorganAuthor"}, "372": {"n": "Brent Chumley", "s": "Fantasy illustrator for D&D, Pathfinder, Shadowrun, Battletech, card games and maps.", "b": "Brent is a graduate of Southern Illinois University at Edwardsville and has produced art for a multitude of media including cover paintings, interior illustrations, collectible card art, cartography (maps), graphic design, page layout, t-shirt designs, miniatures paintings, concept art and commercial photography for a plethora of clients. Some of the gaming brands Brent has produced work for include: Dungeons & Dragons, D&D Dragonfire, Paizo Pathfinder Runefire, Shadowrun, Battletech, Leviathans, Legend of the Five Rings (CCG and RPG), Doomtown: Reloaded CCG, 7th Sea Card Game, Lethal Fantasy, Four Horsemen Toys, Metal Magic & Lore, The Vampire’s Codex, as well as his own DragonVerses® line of art. Brent lives in southern mid-Illinois and is available for commissions."}, "3722": {"n": "Nick Butcher", "s": "", "b": ""}, "377": {"n": "Mike Cole", "s": "Art director at Sportsprint.", "b": ""}, "397": {"n": "Sherri Dean", "s": "Horror author, artist, costumer, emcee and masquerade judge (\"Feisty Mistress of Fear\").", "b": "Jack-o-lantern of all trades, Monster of none- The Feisty Mistress of Fear is here! Sherri Dean is a published author, artist , editor, costumer, emcee, singer, masquerade judge and more. All that and she still finds time to sharpen her razor wit and collect Funko POPs! Fans and fiends can find her on Facebook and sometimes that Twitter-pated X site."}, "4062": {"n": "Jennifer Oleson", "s": "Costume prop and accessory maker who loves research rabbit holes.", "b": "Reading, video games, cats, coffee, crafts.  That's it. That's me in a nutshell. I mean...not all at once. That would be weird. Don't be silly. I don't like to leave the house either. Like, if I can go a whole week without leaving, I'm pretty happy. More than a week is bliss. #BasementTrollLife.  So, there I am, in my basement, and I like to make things that I can use in costuming. Over the years this has lead me down some weird rabbit holes because I get these crackhead ideas like \"I want to be a tengu!\" This then starts me off down research lane trying to figure out things like what the little hat thingie is called (a tokin), how to make one that looks right with materials i have on hand (cardboard), and has the correct number of folds (13), or how to make a rope (kumihimo) because standard twisted ropes (blargh) are not right and buying one of the correct length (too short!) with the correct braiding (did I already say Kumihimo?) is too expensive and the wrong colors anyway (looking at you, neon green). So there I am, with no life to speak of, now making my as-authentic-as-possible costuming that no one recognizes what the heck it is. No really. Sniffle. It's fine. I'm fine. Sniffle. Really. But that's okay. I'll keep on living like a hermit in my quiet basement and learn more crafts just because I have an unholy streak of curiosity.  And besides, nothing says \"I can make esoteric thingies!\" like working at a water company, right? And, lucky you!! This year I agreed to offer some of my weird hobby choices as beginner's classes for making some traditional-style Japanese artforms. You, too, can go down the crafting rabbit hole! Be careful. It's addictive. It's also like a starter drug. Once you start one craft, you'll probably want to do more. Don't say you weren't warned!"}, "407": {"n": "Elizabeth Donald", "s": "Dark fiction writer: Blackfire urban fantasy and Nocturne vampire mystery series, plus horror and SF. Also a journalist and photographer.", "b": "Elizabeth Donald is a dark fiction writer fond of things that go chomp in the night. She is the author of the Blackfire and Nocturne series, as well as other novels, novellas and stories in the horror, science fiction and dark fantasy genres. She is a three-time winner of the Darrell Award for speculative fiction and finalist for the Prism and Imadjinn fiction awards. More recently, she received the Mimi Zanger Literary Award and was shortlisted for the Knost Award. She is the founder of the Literary Underworld small-press cooperative; an award-winning journalist and essayist with nearly 30 years in nonfiction writing; and a nature and art photographer. Her short fiction publications have included Stories We Tell After Midnight, River Bluff Review, Coppice and Brake, parABnormal, Foul Womb of Night, Distinctive Fiction, Weird STL and others. She holds a masters degree in media studies and an MFA in creative writing, and is a professor of journalism, creative writing and English. She serves as president of the St. Louis Society of Professional Journalists and the Eville Writers, vice president of the AWP Adjunct Writers Caucus, and is a member of the Association of Writers and Writing Programs, Authors Against Book Bans, Authors Guild, St. Louis Writers Guild and more writing and trade organizations than is healthy. She lives with her family in a haunted house in Edwardsville, Illinois. In her spare time, she has no spare time."}, "4126": {"n": "Mary Haselbauer", "s": "", "b": ""}, "422": {"n": "Angie Fox", "s": "NYT bestselling paranormal comedy author: Southern Ghost Hunter, Accidental Demon Slayer.", "b": "New York Times and USA Today bestselling author Angie Fox writes action-packed fantasy/adventure about biker witches, ghost hunters, and things that go bump in the night. Her books have been called “fabulously fun” by the Chicago Tribune and have won multiple Daphne awards for mystery and PRISM awards for fantasy. Angie is from St. Louis and Archon is one of her favorite conferences ever. Angie is best known for the SOUTHERN GHOST HUNTER series, the Monster MASH series, and for her ACCIDENTAL DEMON SLAYER books. If you’d like to check out her work, Angie’s first book the SOUTHERN GHOST HUNTER series is available for free right now on all ebook vendors. It’s called SOUTHERN SPIRITS and has 15,000+ reviews on Amazon, with a 4.5 star rating. You can also visit Angie at www.angiefox.com. Or track her down sometime this weekend!"}, "4319": {"n": "Betsy Britt", "s": "", "b": ""}, "432": {"n": "Jimmy D. Gillentine", "s": "Memphis-born horror and dark romance author (The Beast Within trilogy); BBQ YouTuber.", "b": "Jim D. Gillentine grew up with a fondness for horror, science fiction and fantasy love stories flavored with the southern tang of his native Memphis. His debut novella, Of Blood and the Moon, was published in 2009 and was the first runner-up for the Darrell Award. His novel The Beast Within begins as a bittersweet love story between a woman and a beast, which continues in Crossroads, pu
